<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing People - 3D 인체 구도 & 포즈 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        canvas {
            touch-action: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .custom-shadow {
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1);
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #93c5fd;
            border-radius: 9999px;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0284c7;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-sky-100 text-slate-800 h-screen w-screen relative overflow-hidden">

    <!-- 1단계: 시작 화면 (Start Screen) -->
    <div id="startScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-sky-200 via-sky-300 to-indigo-200 p-4 transition-all duration-500">
        <div class="glass-panel p-8 md:p-10 rounded-3xl max-w-md w-full text-center custom-shadow border border-white/60 transform transition-all hover:scale-[1.01]">
            <div class="w-20 h-20 bg-sky-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-sky-400/50 mb-5 text-white">
                <i class="fa-solid fa-child-reaching text-4xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-sky-900 tracking-tight mb-2">Drawing People</h1>
            <p class="text-sky-700 text-sm font-medium mb-8">인체 비율과 다양한 구도를 쉽고 완벽하게!</p>

            <div class="space-y-5 text-left mb-8">
                <div>
                    <label class="block text-xs font-bold text-sky-900 uppercase tracking-wider mb-2">1. 성별 선택 (Gender)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectGender('male')" id="btnMale" class="gender-btn flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-sky-400 bg-sky-50 text-sky-800 font-bold transition-all shadow-sm">
                            <i class="fa-solid fa-mars text-lg"></i> 남성 (Male)
                        </button>
                        <button type="button" onclick="selectGender('female')" id="btnFemale" class="gender-btn flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-transparent bg-white/70 text-slate-600 font-bold hover:bg-sky-50 transition-all shadow-sm">
                            <i class="fa-solid fa-venus text-lg"></i> 여성 (Female)
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-sky-900 uppercase tracking-wider mb-2">2. 연령대 선택 (Age)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectAge('adult')" id="btnAdult" class="age-btn flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-sky-400 bg-sky-50 text-sky-800 font-bold transition-all shadow-sm">
                            <i class="fa-solid fa-user text-lg"></i> 어른 (8등신)
                        </button>
                        <button type="button" onclick="selectAge('child')" id="btnChild" class="age-btn flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-transparent bg-white/70 text-slate-600 font-bold hover:bg-sky-50 transition-all shadow-sm">
                            <i class="fa-solid fa-child text-lg"></i> 아이 (5등신)
                        </button>
                    </div>
                </div>
            </div>

            <button onclick="startApp()" class="w-full py-4 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-extrabold text-lg rounded-xl shadow-lg shadow-sky-500/30 transform active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>3D 입체 모델 시작하기</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        
        <p class="mt-6 text-xs text-sky-800/80 font-medium">생성형 AI 앱·게임 만들기 | 구민채 활동지 기획서 기반 제작</p>
    </div>

    <!-- 2단계: 메인 실행 화면 (Main Canvas Screen) -->
    <div id="mainScreen" class="relative w-full h-full flex flex-col hidden">
        
        <header class="absolute top-0 left-0 right-0 z-30 p-4 flex justify-between items-center pointer-events-none">
            <div class="glass-panel px-4 py-2.5 rounded-2xl shadow-md pointer-events-auto flex items-center gap-3">
                <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center text-white font-bold text-sm">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-slate-800">Drawing People</h2>
                    <p id="modelStatus" class="text-xs font-semibold text-sky-600">성인 · 남성 (8등신)</p>
                </div>
            </div>

            <div class="glass-panel px-4 py-2 rounded-2xl shadow-md pointer-events-auto flex items-center gap-3">
                <div class="flex items-center gap-2 text-slate-700 font-bold text-sm">
                    <i class="fa-regular fa-clock text-sky-600 text-base"></i>
                    <span id="timerDisplay" class="font-mono text-base text-slate-900">05:00</span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btnTimerToggle" onclick="toggleTimer()" class="p-1.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-white transition">
                        <i class="fa-solid fa-play text-xs" id="timerIcon"></i>
                    </button>
                    <button onclick="resetTimer()" class="p-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 transition">
                        <i class="fa-solid fa-rotate-right text-xs"></i>
                    </button>
                    <select id="timerPreset" onchange="setTimerPreset(this.value)" class="text-xs bg-slate-100 border border-slate-300 rounded-lg px-2 py-1 ml-1 font-semibold text-slate-700 outline-none">
                        <option value="60">1분 스케치</option>
                        <option value="180">3분 스케치</option>
                        <option value="300" selected>5분 스케치</option>
                        <option value="0">자유 연습</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Controls Floating Bar -->
        <aside class="absolute top-16 right-4 bottom-16 z-30 flex flex-col gap-3 pointer-events-none w-64 overflow-y-auto pr-1">
            
            <div class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto space-y-2">
                <div class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-1 flex items-center justify-between">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-person-dots-from-line text-sky-500"></i> 지정 포즈 (Pose)</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="changePose('stand')" id="poseBtnStand" class="pose-btn p-2 rounded-xl bg-sky-500 text-white font-bold text-xs flex items-center justify-between transition shadow-sm">
                        <span>차렷 포즈</span>
                        <i class="fa-solid fa-child text-xs"></i>
                    </button>
                    <button onclick="changePose('vsign')" id="poseBtnVsign" class="pose-btn p-2 rounded-xl bg-white hover:bg-sky-50 text-slate-700 font-bold text-xs flex items-center justify-between transition border border-slate-200">
                        <span>브이(V) 포즈</span>
                        <i class="fa-solid fa-hand-peace text-xs text-sky-500"></i>
                    </button>
                    <button onclick="changePose('sit')" id="poseBtnSit" class="pose-btn p-2 rounded-xl bg-white hover:bg-sky-50 text-slate-700 font-bold text-xs flex items-center justify-between transition border border-slate-200">
                        <span>앉아있기</span>
                        <i class="fa-solid fa-chair text-xs text-sky-500"></i>
                    </button>
                    <button onclick="changePose('walk')" id="poseBtnWalk" class="pose-btn p-2 rounded-xl bg-white hover:bg-sky-50 text-slate-700 font-bold text-xs flex items-center justify-between transition border border-slate-200">
                        <span>걷기 포즈</span>
                        <i class="fa-solid fa-person-walking text-xs text-sky-500"></i>
                    </button>
                </div>
            </div>

            <!-- Joint Control Panel -->
            <div class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto space-y-2.5">
                <div class="text-xs font-extrabold text-sky-600 uppercase tracking-wider flex items-center justify-between">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-sliders text-sky-500"></i> 관절 직접 조작</span>
                    <span class="text-[10px] text-slate-400 font-normal">3D 클릭 가능</span>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">조작할 관절 선택</label>
                    <select id="jointSelect" onchange="onJointSelectChange(this.value)" class="w-full text-xs bg-white border border-sky-300 rounded-lg px-2.5 py-1.5 font-bold text-slate-800 outline-none shadow-sm focus:ring-2 focus:ring-sky-400">
                        <option value="head">머리 (Head)</option>
                        <option value="torso">상체 (Torso)</option>
                        <option value="rShoulder" selected>오른쪽 어깨 (Right Shoulder)</option>
                        <option value="rElbow">오른쪽 팔꿈치 (Right Elbow)</option>
                        <option value="rWrist">오른쪽 손목 (Right Wrist)</option>
                        <option value="lShoulder">왼쪽 어깨 (Left Shoulder)</option>
                        <option value="lElbow">왼쪽 팔꿈치 (Left Elbow)</option>
                        <option value="lWrist">왼쪽 손목 (Left Wrist)</option>
                        <option value="rHip">오른쪽 허벅지 (Right Hip)</option>
                        <option value="rKnee">오른쪽 무릎 (Right Knee)</option>
                        <option value="lHip">왼쪽 허벅지 (Left Hip)</option>
                        <option value="lKnee">왼쪽 무릎 (Left Knee)</option>
                    </select>
                </div>

                <div class="space-y-2 bg-white/60 p-2.5 rounded-xl border border-slate-200">
                    <div>
                        <div class="flex justify-between items-center text-[11px] font-bold text-slate-600 mb-0.5">
                            <span>X축 회전 (상하)</span>
                            <div class="flex items-center gap-0.5">
                                <input type="number" id="inputRotX" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('input')" class="w-14 text-right px-1.5 py-0.5 text-xs font-mono font-bold text-sky-600 bg-white border border-slate-300 rounded-md focus:ring-1 focus:ring-sky-500 outline-none">
                                <span class="text-xs font-bold text-sky-600">°</span>
                            </div>
                        </div>
                        <input type="range" id="sliderRotX" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('slider')" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <div>
                        <div class="flex justify-between items-center text-[11px] font-bold text-slate-600 mb-0.5">
                            <span>Y축 회전 (좌우)</span>
                            <div class="flex items-center gap-0.5">
                                <input type="number" id="inputRotY" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('input')" class="w-14 text-right px-1.5 py-0.5 text-xs font-mono font-bold text-sky-600 bg-white border border-slate-300 rounded-md focus:ring-1 focus:ring-sky-500 outline-none">
                                <span class="text-xs font-bold text-sky-600">°</span>
                            </div>
                        </div>
                        <input type="range" id="sliderRotY" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('slider')" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <div>
                        <div class="flex justify-between items-center text-[11px] font-bold text-slate-600 mb-0.5">
                            <span>Z축 회전 (기울임)</span>
                            <div class="flex items-center gap-0.5">
                                <input type="number" id="inputRotZ" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('input')" class="w-14 text-right px-1.5 py-0.5 text-xs font-mono font-bold text-sky-600 bg-white border border-slate-300 rounded-md focus:ring-1 focus:ring-sky-500 outline-none">
                                <span class="text-xs font-bold text-sky-600">°</span>
                            </div>
                        </div>
                        <input type="range" id="sliderRotZ" min="-180" max="180" value="0" oninput="updateSelectedJointRotation('slider')" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                </div>

                <button onclick="resetSelectedJoint()" class="w-full py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs transition">
                    선택 관절 각도 초기화
                </button>
            </div>

            <!-- Hand Details Control Panel -->
            <div class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto space-y-2">
                <div class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-1 flex items-center justify-between">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-hand text-sky-500"></i> 손 디테일 & 모양 (Hand View)</span>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">시점 포커스 (Zoom View)</label>
                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="setCameraFocus('body')" id="focusBody" class="py-1 px-1.5 rounded-lg text-[11px] font-bold bg-sky-500 text-white text-center transition">전신</button>
                        <button onclick="setCameraFocus('rHand')" id="focusRHand" class="py-1 px-1.5 rounded-lg text-[11px] font-bold bg-white hover:bg-sky-50 text-slate-700 border border-slate-200 text-center transition">오른손 확대</button>
                        <button onclick="setCameraFocus('lHand')" id="focusLHand" class="py-1 px-1.5 rounded-lg text-[11px] font-bold bg-white hover:bg-sky-50 text-slate-700 border border-slate-200 text-center transition">왼손 확대</button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">오른손 모양 (Right Hand)</label>
                    <select id="rHandGestureSelect" onchange="changeHandGesture('right', this.value)" class="w-full text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-bold text-slate-800 outline-none">
                        <option value="open" selected>✋ 펴진 손 (Open)</option>
                        <option value="v_sign">✌️ 브이 (V Sign)</option>
                        <option value="fist">✊ 주먹 (Fist)</option>
                        <option value="finger_heart">🫰 손가락 하트 (Heart)</option>
                        <option value="point">👆 지적하기 (Point)</option>
                        <option value="ok_sign">👌 OK 손모양 (OK)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-1">왼손 모양 (Left Hand)</label>
                    <select id="lHandGestureSelect" onchange="changeHandGesture('left', this.value)" class="w-full text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5 font-bold text-slate-800 outline-none">
                        <option value="open" selected>✋ 펴진 손 (Open)</option>
                        <option value="fist">✊ 주먹 (Fist)</option>
                        <option value="v_sign">✌️ 브이 (V Sign)</option>
                        <option value="finger_heart">🫰 손가락 하트 (Heart)</option>
                        <option value="point">👆 지적하기 (Point)</option>
                        <option value="ok_sign">👌 OK 손모양 (OK)</option>
                    </select>
                </div>
            </div>

            <div class="glass-panel p-3 rounded-2xl shadow-lg pointer-events-auto space-y-2">
                <div class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-eye text-sky-500"></i> 그리기 도구 & 설정
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="quickToggleGender('male')" id="quickMale" class="py-1.5 px-2 rounded-lg text-xs font-bold bg-sky-500 text-white text-center transition">남성</button>
                    <button onclick="quickToggleGender('female')" id="quickFemale" class="py-1.5 px-2 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 text-center transition">여성</button>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="quickToggleAge('adult')" id="quickAdult" class="py-1.5 px-2 rounded-lg text-xs font-bold bg-sky-500 text-white text-center transition">어른 (8등신)</button>
                    <button onclick="quickToggleAge('child')" id="quickChild" class="py-1.5 px-2 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 text-center transition">아이 (5등신)</button>
                </div>
                <button onclick="toggleGrid()" id="btnGrid" class="w-full text-left px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-between transition">
                    <span>바닥 그리드</span>
                    <i class="fa-solid fa-border-all text-xs"></i>
                </button>
                <button onclick="toggleHeadLines()" id="btnLines" class="w-full text-left px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-between transition">
                    <span>등신 가이드라인</span>
                    <i class="fa-solid fa-ruler-vertical text-xs"></i>
                </button>
                <button onclick="resetCameraView()" class="w-full text-left px-3 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold text-xs flex items-center justify-between transition">
                    <span>시점 정면 리셋</span>
                    <i class="fa-solid fa-camera-rotate text-xs"></i>
                </button>
            </div>
        </aside>

        <!-- 3D Canvas Container -->
        <div id="canvasContainer" class="w-full h-full relative flex-grow cursor-grab active:cursor-grabbing">
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 glass-panel px-4 py-2 rounded-full shadow-lg text-xs font-bold text-sky-900 pointer-events-none flex items-center gap-2">
                <i class="fa-solid fa-hand-pointer text-sky-500 animate-bounce"></i>
                <span>마네킹 클릭: 관절 선택 | 화면 드래그: 360도 구도 회전 | 휠: 확대/축소</span>
            </div>
        </div>

        <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 glass-panel px-5 py-3 rounded-2xl shadow-xl border border-sky-300 text-sky-900 font-bold text-sm hidden transition-all duration-300 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-sky-500 text-base"></i>
            <span id="toastMsg">알림 메시지</span>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let currentGender = 'male';
        let currentAge = 'adult';
        let currentPose = 'stand';
        let currentJointKey = 'rShoulder';
        let currentCameraFocus = 'body';
        
        let currentRightHandGesture = 'open';
        let currentLeftHandGesture = 'open';

        const basePoseRotations = {};

        // --- Three.js Globals ---
        let scene, camera, renderer, raycaster, mouse;
        let mannequinGroup, bodyParts = {}, fingerMeshes = { left: {}, right: {} };
        let headGuideLinesGroup, gridHelper;
        let selectedHighlightMesh = null;
        
        // Orbit Camera Controls State
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let mouseDragDistance = 0;
        let cameraRadius = 6.5;
        let cameraTheta = Math.PI / 2;
        let cameraPhi = Math.PI / 2.2;
        let targetCenter = new THREE.Vector3(0, 1.2, 0);
        let activeTargetCenter = new THREE.Vector3(0, 1.2, 0);

        // Croquis Timer State
        let timerSeconds = 300;
        let timerMax = 300;
        let timerInterval = null;
        let isTimerRunning = false;

        function selectGender(gender) {
            currentGender = gender;
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.classList.remove('border-sky-400', 'bg-sky-50', 'text-sky-800');
                btn.classList.add('border-transparent', 'bg-white/70', 'text-slate-600');
            });
            const selectedBtn = gender === 'male' ? document.getElementById('btnMale') : document.getElementById('btnFemale');
            if (selectedBtn) {
                selectedBtn.classList.remove('border-transparent', 'bg-white/70', 'text-slate-600');
                selectedBtn.classList.add('border-sky-400', 'bg-sky-50', 'text-sky-800');
            }
        }

        function selectAge(age) {
            currentAge = age;
            document.querySelectorAll('.age-btn').forEach(btn => {
                btn.classList.remove('border-sky-400', 'bg-sky-50', 'text-sky-800');
                btn.classList.add('border-transparent', 'bg-white/70', 'text-slate-600');
            });
            const selectedBtn = age === 'adult' ? document.getElementById('btnAdult') : document.getElementById('btnChild');
            if (selectedBtn) {
                selectedBtn.classList.remove('border-transparent', 'bg-white/70', 'text-slate-600');
                selectedBtn.classList.add('border-sky-400', 'bg-sky-50', 'text-sky-800');
            }
        }

        function startApp() {
            document.getElementById('startScreen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                init3D();
                updateUIState();
            }, 300);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('hidden');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        function init3D() {
            const container = document.getElementById('canvasContainer');
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0f2fe);
            scene.fog = new THREE.FogExp2(0xe0f2fe, 0.05);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            gridHelper = new THREE.GridHelper(10, 20, 0x0284c7, 0xbae6fd);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const shadowPlaneGeo = new THREE.PlaneGeometry(10, 10);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.15 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            const ringGeo = new THREE.RingGeometry(0.1, 0.14, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.DoubleSide });
            selectedHighlightMesh = new THREE.Mesh(ringGeo, ringMat);
            selectedHighlightMesh.visible = false;
            scene.add(selectedHighlightMesh);

            buildMannequin();
            setupEventListeners(container);
            animate();
        }

        function buildMannequin() {
            if (mannequinGroup) scene.remove(mannequinGroup);
            if (headGuideLinesGroup) scene.remove(headGuideLinesGroup);

            mannequinGroup = new THREE.Group();
            headGuideLinesGroup = new THREE.Group();

            const isAdult = currentAge === 'adult';
            const isFemale = currentGender === 'female';

            const headScale = isAdult ? 1.0 : 1.1;
            const heightFactor = isAdult ? 1.0 : 0.65;
            const shoulderWidth = isFemale ? (isAdult ? 0.44 : 0.34) : (isAdult ? 0.58 : 0.38);
            const hipWidth = isFemale ? 0.42 : 0.36;

            const mannequinMat = new THREE.MeshStandardMaterial({
                color: isFemale ? 0xf43f5e : 0x0284c7,
                roughness: 0.3,
                metalness: 0.15
            });
            const jointMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                roughness: 0.35,
                metalness: 0.2
            });

            bodyParts = {};
            fingerMeshes = { left: {}, right: {} };

            // Pelvis
            const pelvisGeo = new THREE.CylinderGeometry(hipWidth * 0.48, hipWidth * 0.42, 0.28 * heightFactor, 16);
            const pelvis = new THREE.Mesh(pelvisGeo, mannequinMat);
            pelvis.position.set(0, 1.1 * heightFactor, 0);
            pelvis.castShadow = true;
            pelvis.userData = { jointKey: 'torso', name: '상체/골반' };
            mannequinGroup.add(pelvis);
            bodyParts.pelvis = pelvis;

            // Chest & Torso
            const chestGeo = new THREE.CylinderGeometry(shoulderWidth * 0.52, hipWidth * 0.38, 0.62 * heightFactor, 16);
            const torso = new THREE.Mesh(chestGeo, mannequinMat);
            torso.position.set(0, 0.45 * heightFactor, 0);
            torso.castShadow = true;
            torso.userData = { jointKey: 'torso', name: '상체' };
            pelvis.add(torso);
            bodyParts.torso = torso;

            // Neck & Head
            const neckGeo = new THREE.CylinderGeometry(0.075, 0.085, 0.16 * heightFactor, 12);
            const neck = new THREE.Mesh(neckGeo, jointMat);
            neck.position.set(0, 0.36 * heightFactor, 0);
            torso.add(neck);

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 0.1 * heightFactor, 0);
            headGroup.userData = { jointKey: 'head', name: '머리' };
            neck.add(headGroup);
            bodyParts.head = headGroup;

            // Head & Facial Contours
            const headGeo = new THREE.SphereGeometry(0.2 * headScale, 24, 24);
            headGeo.scale(0.92, 1.22, 1.02);
            const headMesh = new THREE.Mesh(headGeo, mannequinMat);
            headMesh.position.set(0, 0.15 * headScale, 0);
            headMesh.castShadow = true;
            headMesh.userData = { jointKey: 'head', name: '머리' };
            headGroup.add(headMesh);

            const browGeo = new THREE.BoxGeometry(0.24 * headScale, 0.04 * headScale, 0.08 * headScale);
            const browMesh = new THREE.Mesh(browGeo, mannequinMat);
            browMesh.position.set(0, 0.20 * headScale, 0.13 * headScale);
            browMesh.rotation.x = 0.1;
            headGroup.add(browMesh);

            const cheekGeo = new THREE.SphereGeometry(0.065 * headScale, 12, 12);
            cheekGeo.scale(1.2, 0.8, 1.0);
            const rCheek = new THREE.Mesh(cheekGeo, mannequinMat);
            rCheek.position.set(-0.088 * headScale, 0.13 * headScale, 0.12 * headScale);
            headGroup.add(rCheek);

            const lCheek = new THREE.Mesh(cheekGeo, mannequinMat);
            lCheek.position.set(0.088 * headScale, 0.13 * headScale, 0.12 * headScale);
            headGroup.add(lCheek);

            const noseBridgeGeo = new THREE.CylinderGeometry(0.015 * headScale, 0.03 * headScale, 0.1 * headScale, 8);
            const noseBridge = new THREE.Mesh(noseBridgeGeo, jointMat);
            noseBridge.rotation.x = -0.3;
            noseBridge.position.set(0, 0.14 * headScale, 0.20 * headScale);
            headGroup.add(noseBridge);

            const noseTipGeo = new THREE.SphereGeometry(0.028 * headScale, 10, 10);
            const noseTip = new THREE.Mesh(noseTipGeo, jointMat);
            noseTip.position.set(0, 0.10 * headScale, 0.225 * headScale);
            headGroup.add(noseTip);

            const lipGeo = new THREE.CylinderGeometry(0.045 * headScale, 0.04 * headScale, 0.025 * headScale, 12);
            lipGeo.scale(1.2, 1, 0.6);
            const lipMesh = new THREE.Mesh(lipGeo, mannequinMat);
            lipMesh.position.set(0, 0.055 * headScale, 0.18 * headScale);
            headGroup.add(lipMesh);

            const chinGeo = new THREE.ConeGeometry(0.11 * headScale, 0.16 * headScale, 12);
            chinGeo.rotateX(Math.PI);
            const chinMesh = new THREE.Mesh(chinGeo, mannequinMat);
            chinMesh.position.set(0, 0.01 * headScale, 0.04 * headScale);
            headGroup.add(chinMesh);

            const earGeo = new THREE.BoxGeometry(0.03 * headScale, 0.09 * headScale, 0.05 * headScale);
            const rEar = new THREE.Mesh(earGeo, jointMat);
            rEar.position.set(-0.19 * headScale, 0.15 * headScale, 0.01 * headScale);
            rEar.rotation.y = -0.2;
            headGroup.add(rEar);

            const lEar = new THREE.Mesh(earGeo, jointMat);
            lEar.position.set(0.19 * headScale, 0.15 * headScale, 0.01 * headScale);
            lEar.rotation.y = 0.2;
            headGroup.add(lEar);

            function createAnatomicalLimb(length, topRadius, midRadius, bottomRadius, key, name) {
                const group = new THREE.Group();
                group.userData = { jointKey: key, name: name };

                const jointGeo = new THREE.SphereGeometry(topRadius * 1.15, 16, 16);
                const joint = new THREE.Mesh(jointGeo, jointMat);
                joint.userData = { jointKey: key, name: name };
                group.add(joint);

                const seg1Geo = new THREE.CylinderGeometry(topRadius, midRadius, length * 0.55, 16);
                seg1Geo.translate(0, -length * 0.275, 0);
                const seg1 = new THREE.Mesh(seg1Geo, mannequinMat);
                seg1.castShadow = true;
                seg1.userData = { jointKey: key, name: name };
                group.add(seg1);

                const seg2Geo = new THREE.CylinderGeometry(midRadius, bottomRadius, length * 0.45, 16);
                seg2Geo.translate(0, -length * 0.775, 0);
                const seg2 = new THREE.Mesh(seg2Geo, mannequinMat);
                seg2.castShadow = true;
                seg2.userData = { jointKey: key, name: name };
                group.add(seg2);

                return group;
            }

            const armLen = 0.42 * heightFactor;

            // Left Arm
            const lShoulder = createAnatomicalLimb(armLen, 0.085, 0.075, 0.065, 'lShoulder', '왼쪽 어깨');
            lShoulder.position.set(shoulderWidth * 0.58, 0.26 * heightFactor, 0);
            torso.add(lShoulder);
            bodyParts.lShoulder = lShoulder;

            const lElbow = createAnatomicalLimb(armLen, 0.068, 0.06, 0.048, 'lElbow', '왼쪽 팔꿈치');
            lElbow.position.set(0, -armLen, 0);
            lShoulder.add(lElbow);
            bodyParts.lElbow = lElbow;

            const lWrist = new THREE.Group();
            lWrist.position.set(0, -armLen, 0);
            lWrist.userData = { jointKey: 'lWrist', name: '왼쪽 손목' };
            lElbow.add(lWrist);
            bodyParts.lWrist = lWrist;
            buildDetailedHand(lWrist, 'left', jointMat, mannequinMat);

            // Right Arm
            const rShoulder = createAnatomicalLimb(armLen, 0.085, 0.075, 0.065, 'rShoulder', '오른쪽 어깨');
            rShoulder.position.set(-shoulderWidth * 0.58, 0.26 * heightFactor, 0);
            torso.add(rShoulder);
            bodyParts.rShoulder = rShoulder;

            const rElbow = createAnatomicalLimb(armLen, 0.068, 0.06, 0.048, 'rElbow', '오른쪽 팔꿈치');
            rElbow.position.set(0, -armLen, 0);
            rShoulder.add(rElbow);
            bodyParts.rElbow = rElbow;

            const rWrist = new THREE.Group();
            rWrist.position.set(0, -armLen, 0);
            rWrist.userData = { jointKey: 'rWrist', name: '오른쪽 손목' };
            rElbow.add(rWrist);
            bodyParts.rWrist = rWrist;
            buildDetailedHand(rWrist, 'right', jointMat, mannequinMat);

            // Legs
            const legLen = 0.56 * heightFactor;

            const lHip = createAnatomicalLimb(legLen, 0.105, 0.095, 0.075, 'lHip', '왼쪽 허벅지');
            lHip.position.set(hipWidth * 0.35, -0.1 * heightFactor, 0);
            pelvis.add(lHip);
            bodyParts.lHip = lHip;

            const lKnee = createAnatomicalLimb(legLen, 0.08, 0.072, 0.055, 'lKnee', '왼쪽 무릎');
            lKnee.position.set(0, -legLen, 0);
            lHip.add(lKnee);
            bodyParts.lKnee = lKnee;

            const rHip = createAnatomicalLimb(legLen, 0.105, 0.095, 0.075, 'rHip', '오른쪽 허벅지');
            rHip.position.set(-hipWidth * 0.35, -0.1 * heightFactor, 0);
            pelvis.add(rHip);
            bodyParts.rHip = rHip;

            const rKnee = createAnatomicalLimb(legLen, 0.08, 0.072, 0.055, 'rKnee', '오른쪽 무릎');
            rKnee.position.set(0, -legLen, 0);
            rHip.add(rKnee);
            bodyParts.rKnee = rKnee;

            scene.add(mannequinGroup);

            // Head Guidelines
            const headCount = isAdult ? 8 : 5;
            const totalHeight = 2.2 * heightFactor;
            const step = totalHeight / headCount;

            for (let i = 0; i <= headCount; i++) {
                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-1.2, i * step, 0),
                    new THREE.Vector3(1.2, i * step, 0)
                ]);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.4 });
                const line = new THREE.Line(lineGeo, lineMat);
                headGuideLinesGroup.add(line);
            }
            headGuideLinesGroup.visible = false;
            scene.add(headGuideLinesGroup);

            applyPose(currentPose);
            applyHandGesture('right', currentRightHandGesture);
            applyHandGesture('left', currentLeftHandGesture);
        }

        function buildDetailedHand(wristGroup, handSide, jointMat, mainMat) {
            const sideSign = handSide === 'left' ? 1 : -1;
            
            const palmGeo = new THREE.BoxGeometry(0.09, 0.11, 0.035);
            const palm = new THREE.Mesh(palmGeo, mainMat);
            palm.position.set(0, -0.06, 0);
            palm.castShadow = true;
            palm.userData = { jointKey: handSide === 'left' ? 'lWrist' : 'rWrist', name: '손바닥' };
            wristGroup.add(palm);

            fingerMeshes[handSide] = {};

            const fingers = [
                { name: 'thumb', x: sideSign * 0.05, y: -0.01, z: 0.01, scale: 0.75 },
                { name: 'index', x: sideSign * 0.032, y: -0.11, z: 0, scale: 0.85 },
                { name: 'middle', x: sideSign * 0.01, y: -0.12, z: 0, scale: 0.95 },
                { name: 'ring', x: sideSign * -0.012, y: -0.11, z: 0, scale: 0.88 },
                { name: 'pinky', x: sideSign * -0.033, y: -0.095, z: 0, scale: 0.72 }
            ];

            fingers.forEach(f => {
                const fGroup = new THREE.Group();
                fGroup.position.set(f.x, f.y, f.z);
                fGroup.userData = { jointKey: handSide === 'left' ? 'lWrist' : 'rWrist' };
                palm.add(fGroup);

                const p1Geo = new THREE.CylinderGeometry(0.011 * f.scale, 0.009 * f.scale, 0.04 * f.scale, 8);
                p1Geo.translate(0, -0.02 * f.scale, 0);
                const p1 = new THREE.Mesh(p1Geo, mainMat);
                fGroup.add(p1);

                const p2Group = new THREE.Group();
                p2Group.position.set(0, -0.04 * f.scale, 0);
                fGroup.add(p2Group);

                const p2Geo = new THREE.CylinderGeometry(0.009 * f.scale, 0.007 * f.scale, 0.035 * f.scale, 8);
                p2Geo.translate(0, -0.0175 * f.scale, 0);
                const p2 = new THREE.Mesh(p2Geo, mainMat);
                p2Group.add(p2);

                fingerMeshes[handSide][f.name] = { root: fGroup, mid: p2Group };
            });
        }

        function changeHandGesture(handSide, gestureKey) {
            if (handSide === 'right') currentRightHandGesture = gestureKey;
            else currentLeftHandGesture = gestureKey;

            applyHandGesture(handSide, gestureKey);
            showToast(`${handSide === 'right' ? '오른손' : '왼손'} 모양 변경완료!`);
        }

        function applyHandGesture(handSide, gestureKey) {
            const fMap = fingerMeshes[handSide];
            if (!fMap || !fMap.index) return;

            const isLeft = handSide === 'left';
            const sSign = isLeft ? 1 : -1;

            Object.values(fMap).forEach(f => {
                f.root.rotation.set(0, 0, 0);
                f.mid.rotation.set(0, 0, 0);
            });

            switch (gestureKey) {
                case 'open':
                    fMap.thumb.root.rotation.set(0.2, sSign * 0.4, 0.2);
                    break;
                case 'fist':
                    ['index', 'middle', 'ring', 'pinky'].forEach(name => {
                        fMap[name].root.rotation.x = Math.PI / 2;
                        fMap[name].mid.rotation.x = Math.PI / 2.2;
                    });
                    fMap.thumb.root.rotation.set(0.4, sSign * 0.8, -sSign * 0.5);
                    break;
                case 'v_sign':
                    ['ring', 'pinky'].forEach(name => {
                        fMap[name].root.rotation.x = Math.PI / 2;
                        fMap[name].mid.rotation.x = Math.PI / 2.2;
                    });
                    fMap.index.root.rotation.set(0, 0, sSign * 0.15);
                    fMap.middle.root.rotation.set(0, 0, -sSign * 0.15);
                    fMap.thumb.root.rotation.set(0.6, sSign * 0.8, -sSign * 0.4);
                    break;
                case 'finger_heart':
                    ['middle', 'ring', 'pinky'].forEach(name => {
                        fMap[name].root.rotation.x = Math.PI / 2;
                        fMap[name].mid.rotation.x = Math.PI / 2.2;
                    });
                    fMap.thumb.root.rotation.set(0.4, sSign * 0.5, sSign * 0.3);
                    fMap.index.root.rotation.set(0.5, -sSign * 0.2, sSign * 0.2);
                    fMap.index.mid.rotation.x = 0.8;
                    break;
                case 'point':
                    ['middle', 'ring', 'pinky'].forEach(name => {
                        fMap[name].root.rotation.x = Math.PI / 2;
                        fMap[name].mid.rotation.x = Math.PI / 2.2;
                    });
                    fMap.thumb.root.rotation.set(0.5, sSign * 0.7, -sSign * 0.4);
                    break;
                case 'ok_sign':
                    fMap.index.root.rotation.set(0.8, -sSign * 0.2, 0);
                    fMap.index.mid.rotation.x = 0.9;
                    fMap.thumb.root.rotation.set(0.8, sSign * 0.6, sSign * 0.2);
                    fMap.thumb.mid.rotation.x = 0.5;
                    break;
            }
        }

        function changePose(poseName) {
            document.getElementById('sliderRotX').value = 0;
            document.getElementById('sliderRotY').value = 0;
            document.getElementById('sliderRotZ').value = 0;
            document.getElementById('inputRotX').value = 0;
            document.getElementById('inputRotY').value = 0;
            document.getElementById('inputRotZ').value = 0;

            applyPose(poseName);
            
            const buttons = [
                { id: 'poseBtnStand', name: 'stand' },
                { id: 'poseBtnVsign', name: 'vsign' },
                { id: 'poseBtnSit', name: 'sit' },
                { id: 'poseBtnWalk', name: 'walk' }
            ];

            buttons.forEach(b => {
                const elem = document.getElementById(b.id);
                if (elem) {
                    if (b.name === poseName) {
                        elem.className = "pose-btn p-2 rounded-xl bg-sky-500 text-white font-bold text-xs flex items-center justify-between transition shadow-sm";
                    } else {
                        elem.className = "pose-btn p-2 rounded-xl bg-white hover:bg-sky-50 text-slate-700 font-bold text-xs flex items-center justify-between transition border border-slate-200";
                    }
                }
            });

            const names = { 'stand': '차렷', 'vsign': '브이(V)', 'sit': '앉기', 'walk': '걷기' };
            showToast(`포즈 선택 완료: ${names[poseName]}`);
        }

        function applyPose(poseName) {
            currentPose = poseName;

            // Reset all limb rotations
            Object.values(bodyParts).forEach(part => {
                if (part) part.rotation.set(0, 0, 0);
            });

            const isAdult = currentAge === 'adult';
            const heightFactor = isAdult ? 1.0 : 0.65;

            if (poseName === 'stand') {
                bodyParts.rShoulder.rotation.z = -0.15;
                bodyParts.lShoulder.rotation.z = 0.15;
                if (bodyParts.pelvis) bodyParts.pelvis.position.y = 1.1 * heightFactor;
            } else if (poseName === 'vsign') {
                // Highly natural V-Sign Pose: Hand strictly aligned with palm facing front (towards camera)
                bodyParts.rShoulder.rotation.set(0.15, -0.10, -0.65);
                bodyParts.rElbow.rotation.set(-2.55, 0.35, -0.30);
                bodyParts.rWrist.rotation.set(0, Math.PI, 0); // 손바닥이 정면(카메라)을 바라보도록 180도 회전 설정

                bodyParts.lShoulder.rotation.set(0, 0, 0.20);
                bodyParts.head.rotation.set(0.02, 0.05, -0.05);

                if (bodyParts.pelvis) bodyParts.pelvis.position.y = 1.1 * heightFactor;

                // Apply V-sign gesture specifically to right hand for this preset
                currentRightHandGesture = 'v_sign';
                document.getElementById('rHandGestureSelect').value = 'v_sign';
                applyHandGesture('right', 'v_sign');
            } else if (poseName === 'sit') {
                const legLen = 0.56 * heightFactor;
                
                bodyParts.rHip.rotation.x = -Math.PI / 2;
                bodyParts.lHip.rotation.x = -Math.PI / 2;
                bodyParts.rKnee.rotation.x = Math.PI / 2;
                bodyParts.lKnee.rotation.x = Math.PI / 2;

                bodyParts.rShoulder.rotation.x = -0.15;
                bodyParts.lShoulder.rotation.x = -0.15;
                bodyParts.rElbow.rotation.x = -0.4;
                bodyParts.lElbow.rotation.x = -0.4;

                if (bodyParts.pelvis) {
                    bodyParts.pelvis.position.y = legLen;
                }
            } else if (poseName === 'walk') {
                bodyParts.rHip.rotation.x = -0.5;
                bodyParts.lHip.rotation.x = 0.5;
                bodyParts.rKnee.rotation.x = 0.6;
                bodyParts.lKnee.rotation.x = 0.1;

                bodyParts.rShoulder.rotation.x = 0.4;
                bodyParts.lShoulder.rotation.x = -0.4;
                bodyParts.rElbow.rotation.x = -0.3;
                bodyParts.lElbow.rotation.x = -0.2;
                if (bodyParts.pelvis) bodyParts.pelvis.position.y = 1.1 * heightFactor;
            }

            // Save baseline pose rotations
            Object.keys(bodyParts).forEach(k => {
                if (bodyParts[k]) {
                    basePoseRotations[k] = bodyParts[k].rotation.clone();
                }
            });

            syncSlidersToJoint(currentJointKey);
            highlightJointMesh(currentJointKey);
        }

        function onJointSelectChange(jointKey) {
            currentJointKey = jointKey;
            syncSlidersToJoint(jointKey);
            highlightJointMesh(jointKey);
        }

        function radToDeg(rad) {
            return Math.round(rad * (180 / Math.PI));
        }

        function degToRad(deg) {
            return deg * (Math.PI / 180);
        }

        function syncSlidersToJoint(jointKey) {
            const part = bodyParts[jointKey];
            if (!part) return;

            const baseRot = basePoseRotations[jointKey] || new THREE.Euler(0, 0, 0);
            
            const deltaX = radToDeg(part.rotation.x - baseRot.x);
            const deltaY = radToDeg(part.rotation.y - baseRot.y);
            const deltaZ = radToDeg(part.rotation.z - baseRot.z);

            document.getElementById('sliderRotX').value = deltaX;
            document.getElementById('sliderRotY').value = deltaY;
            document.getElementById('sliderRotZ').value = deltaZ;

            document.getElementById('inputRotX').value = deltaX;
            document.getElementById('inputRotY').value = deltaY;
            document.getElementById('inputRotZ').value = deltaZ;
        }

        function updateSelectedJointRotation(source) {
            const part = bodyParts[currentJointKey];
            if (!part) return;

            let degX, degY, degZ;

            if (source === 'slider') {
                degX = parseFloat(document.getElementById('sliderRotX').value) || 0;
                degY = parseFloat(document.getElementById('sliderRotY').value) || 0;
                degZ = parseFloat(document.getElementById('sliderRotZ').value) || 0;

                document.getElementById('inputRotX').value = degX;
                document.getElementById('inputRotY').value = degY;
                document.getElementById('inputRotZ').value = degZ;
            } else {
                degX = parseFloat(document.getElementById('inputRotX').value) || 0;
                degY = parseFloat(document.getElementById('inputRotY').value) || 0;
                degZ = parseFloat(document.getElementById('inputRotZ').value) || 0;

                document.getElementById('sliderRotX').value = degX;
                document.getElementById('sliderRotY').value = degY;
                document.getElementById('sliderRotZ').value = degZ;
            }

            const baseRot = basePoseRotations[currentJointKey] || new THREE.Euler(0, 0, 0);

            part.rotation.x = baseRot.x + degToRad(degX);
            part.rotation.y = baseRot.y + degToRad(degY);
            part.rotation.z = baseRot.z + degToRad(degZ);
        }

        function resetSelectedJoint() {
            document.getElementById('sliderRotX').value = 0;
            document.getElementById('sliderRotY').value = 0;
            document.getElementById('sliderRotZ').value = 0;
            document.getElementById('inputRotX').value = 0;
            document.getElementById('inputRotY').value = 0;
            document.getElementById('inputRotZ').value = 0;
            updateSelectedJointRotation('slider');
            showToast('선택한 관절 각도가 초기화되었습니다.');
        }

        function highlightJointMesh(jointKey) {
            const mesh = bodyParts[jointKey];
            if (!mesh || !selectedHighlightMesh) return;

            const worldPos = new THREE.Vector3();
            mesh.getWorldPosition(worldPos);
            selectedHighlightMesh.position.copy(worldPos);
            selectedHighlightMesh.position.z += 0.05;
            selectedHighlightMesh.visible = true;
        }

        function setCameraFocus(focusMode) {
            currentCameraFocus = focusMode;

            const btnBody = document.getElementById('focusBody');
            const btnRHand = document.getElementById('focusRHand');
            const btnLHand = document.getElementById('focusLHand');

            const activeClass = "py-1 px-1.5 rounded-lg text-[11px] font-bold bg-sky-500 text-white text-center transition";
            const inactiveClass = "py-1 px-1.5 rounded-lg text-[11px] font-bold bg-white hover:bg-sky-50 text-slate-700 border border-slate-200 text-center transition";

            btnBody.className = focusMode === 'body' ? activeClass : inactiveClass;
            btnRHand.className = focusMode === 'rHand' ? activeClass : inactiveClass;
            btnLHand.className = focusMode === 'lHand' ? activeClass : inactiveClass;

            if (focusMode === 'body') {
                targetCenter.set(0, 1.2, 0);
                cameraRadius = 6.5;
                cameraTheta = Math.PI / 2;
                cameraPhi = Math.PI / 2.2;
                showToast("시점 변경: 전신 뷰");
            } else if (focusMode === 'rHand' && bodyParts.rWrist) {
                const worldPos = new THREE.Vector3();
                bodyParts.rWrist.getWorldPosition(worldPos);
                targetCenter.copy(worldPos);
                cameraRadius = 1.0;
                currentJointKey = 'rWrist';
                document.getElementById('jointSelect').value = 'rWrist';
                syncSlidersToJoint('rWrist');
                highlightJointMesh('rWrist');
                showToast("시점 변경: 오른손 확대 뷰");
            } else if (focusMode === 'lHand' && bodyParts.lWrist) {
                const worldPos = new THREE.Vector3();
                bodyParts.lWrist.getWorldPosition(worldPos);
                targetCenter.copy(worldPos);
                cameraRadius = 1.0;
                currentJointKey = 'lWrist';
                document.getElementById('jointSelect').value = 'lWrist';
                syncSlidersToJoint('lWrist');
                highlightJointMesh('lWrist');
                showToast("시점 변경: 왼손 확대 뷰");
            }

            updateCameraPosition();
        }

        function updateCameraPosition() {
            cameraPhi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraPhi));
            camera.position.x = targetCenter.x + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
            camera.position.y = targetCenter.y + cameraRadius * Math.cos(cameraPhi);
            camera.position.z = targetCenter.z + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
            camera.lookAt(targetCenter);
        }

        function resetCameraView() {
            setCameraFocus('body');
            showToast("카메라 구도가 정면으로 리셋되었습니다.");
        }

        function setupEventListeners(container) {
            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
                mouseDragDistance = 0;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                mouseDragDistance += Math.abs(deltaX) + Math.abs(deltaY);

                cameraTheta -= deltaX * 0.008;
                cameraPhi -= deltaY * 0.008;

                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', (e) => {
                if (isDragging && mouseDragDistance < 5) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(mannequinGroup.children, true);

                    if (intersects.length > 0) {
                        let hitObj = intersects[0].object;
                        while (hitObj && !hitObj.userData.jointKey && hitObj.parent) {
                            hitObj = hitObj.parent;
                        }
                        if (hitObj && hitObj.userData.jointKey) {
                            const key = hitObj.userData.jointKey;
                            currentJointKey = key;
                            document.getElementById('jointSelect').value = key;
                            syncSlidersToJoint(key);
                            highlightJointMesh(key);
                            showToast(`관절 선택됨: ${hitObj.userData.name || key}`);
                        }
                    }
                }
                isDragging = false;
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraRadius += e.deltaY * 0.005;
                cameraRadius = Math.max(0.5, Math.min(15, cameraRadius));
                updateCameraPosition();
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (!container) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timerIcon').className = 'fa-solid fa-play text-xs';
            } else {
                if (timerSeconds <= 0) timerSeconds = timerMax;
                isTimerRunning = true;
                document.getElementById('timerIcon').className = 'fa-solid fa-pause text-xs';
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimerDisplay();
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        document.getElementById('timerIcon').className = 'fa-solid fa-play text-xs';
                        showToast("⏱️ 연습 시간이 종료되었습니다!");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = timerMax;
            document.getElementById('timerIcon').className = 'fa-solid fa-play text-xs';
            updateTimerDisplay();
        }

        function setTimerPreset(seconds) {
            timerMax = parseInt(seconds);
            timerSeconds = timerMax;
            resetTimer();
        }

        function updateTimerDisplay() {
            if (timerMax === 0) {
                document.getElementById('timerDisplay').innerText = "자유";
                return;
            }
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function quickToggleGender(gender) {
            currentGender = gender;
            selectGender(gender);
            updateUIState();
            buildMannequin();
            showToast(`성별 변경: ${gender === 'male' ? '남성' : '여성'}`);
        }

        function quickToggleAge(age) {
            currentAge = age;
            selectAge(age);
            updateUIState();
            buildMannequin();
            showToast(`연령대 변경: ${age === 'adult' ? '어른 (8등신)' : '아이 (5등신)'}`);
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
            showToast(`바닥 그리드: ${gridHelper.visible ? '켜짐' : '꺼짐'}`);
        }

        function toggleHeadLines() {
            headGuideLinesGroup.visible = !headGuideLinesGroup.visible;
            showToast(`등신 가이드라인: ${headGuideLinesGroup.visible ? '켜짐' : '꺼짐'}`);
        }

        function updateUIState() {
            const statusText = `${currentAge === 'adult' ? '성인 (8등신)' : '아동 (5등신)'} · ${currentGender === 'male' ? '남성' : '여성'}`;
            document.getElementById('modelStatus').innerText = statusText;

            // Sync Main Screen Quick Toggle Buttons highlight
            const activeClass = "py-1.5 px-2 rounded-lg text-xs font-bold bg-sky-500 text-white text-center transition";
            const inactiveClass = "py-1.5 px-2 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 text-center transition";

            const btnQuickMale = document.getElementById('quickMale');
            const btnQuickFemale = document.getElementById('quickFemale');
            if (btnQuickMale && btnQuickFemale) {
                btnQuickMale.className = currentGender === 'male' ? activeClass : inactiveClass;
                btnQuickFemale.className = currentGender === 'female' ? activeClass : inactiveClass;
            }

            const btnQuickAdult = document.getElementById('quickAdult');
            const btnQuickChild = document.getElementById('quickChild');
            if (btnQuickAdult && btnQuickChild) {
                btnQuickAdult.className = currentAge === 'adult' ? activeClass : inactiveClass;
                btnQuickChild.className = currentAge === 'child' ? activeClass : inactiveClass;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (currentCameraFocus === 'rHand' && bodyParts.rWrist) {
                bodyParts.rWrist.getWorldPosition(activeTargetCenter);
                targetCenter.lerp(activeTargetCenter, 0.1);
                updateCameraPosition();
            } else if (currentCameraFocus === 'lHand' && bodyParts.lWrist) {
                bodyParts.lWrist.getWorldPosition(activeTargetCenter);
                targetCenter.lerp(activeTargetCenter, 0.1);
                updateCameraPosition();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
