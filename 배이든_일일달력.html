<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일달력</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-indigo-100 flex flex-col min-h-[650px] relative">
        
        <!-- Top Navigation Bar with Settings & Group Share Buttons -->
        <div class="px-6 py-3 border-b border-gray-100 flex items-center justify-between bg-white">
            <span class="font-extrabold text-gray-800 text-sm flex items-center gap-1.5">
                <span id="app-theme-icon">📅</span> 일일달력
            </span>
            <div class="flex items-center gap-2">
                <!-- Group Share Badge -->
                <button onclick="openGroupModal()" id="group-badge-btn" class="px-2.5 py-1 rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xs font-bold transition-all border border-indigo-100 flex items-center gap-1">
                    👥 함께 하기
                </button>
                <button onclick="openSettingsModal()" class="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-all shadow-sm">
                    ⚙️
                </button>
            </div>
        </div>

        <!-- Dynamic Content injected via JS -->
        <div id="screen-container" class="flex-1 flex flex-col p-6">
            <!-- Rendered by JavaScript -->
        </div>

    </div>

    <!-- Group Code Sharing Modal -->
    <div id="group-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">👥 함께하는 공유 달력</h3>
                <button onclick="closeGroupModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>

            <!-- Current Active Code Info -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-3 text-center">
                <span class="text-[11px] font-bold text-indigo-500 block mb-1">현재 참여 중인 공유 코드</span>
                <div class="flex items-center justify-center gap-2">
                    <span id="current-group-code-display" class="font-black text-xl text-indigo-700 tracking-wider">개인 달력</span>
                    <button onclick="copyGroupCode()" id="copy-code-btn" class="text-xs bg-white text-indigo-600 px-2 py-1 rounded-lg shadow-sm border border-indigo-200 font-bold active:scale-95">복사</button>
                </div>
            </div>

            <!-- Join or Create Group -->
            <div class="space-y-2 pt-1">
                <label class="block text-xs font-bold text-gray-700">🔑 다른 사람의 공유 코드 입력</label>
                <div class="flex gap-2">
                    <input type="text" id="input-group-code" placeholder="예: TEAM-ABC12" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="joinGroupCode()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-2 rounded-xl text-xs transition-all shadow-md">연결</button>
                </div>
            </div>

            <div class="pt-2 border-t flex flex-col gap-2">
                <button onclick="generateNewGroupCode()" class="w-full bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 py-2 rounded-xl font-bold text-xs transition-all">
                    ✨ 새로운 공유 코드 생성하기
                </button>
                <button onclick="switchToPersonalCalendar()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-2 rounded-xl font-bold text-xs transition-all">
                    🏠 개인 달력으로 돌아가기
                </button>
            </div>

            <button onclick="closeGroupModal()" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2.5 rounded-xl font-bold text-xs transition-all">
                닫기
            </button>
        </div>
    </div>

    <!-- Custom Modal for Alerts/Messages -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl transform transition-all scale-95">
            <div id="modal-icon" class="text-4xl mb-3">🎉</div>
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">알림</h3>
            <p id="modal-message" class="text-gray-600 mb-5 text-sm"></p>
            <button onclick="closeModal()" id="modal-action-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold transition-all shadow-md active:scale-95">확인</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">⚙️ 설정</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>

            <!-- Theme Color Picker -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-2">🎨 테마 색상 선택</label>
                <div class="flex gap-2 justify-center">
                    <button onclick="changeTheme('indigo')" class="w-10 h-10 rounded-full bg-indigo-600 hover:scale-110 transition-transform shadow-md"></button>
                    <button onclick="changeTheme('purple')" class="w-10 h-10 rounded-full bg-purple-600 hover:scale-110 transition-transform shadow-md"></button>
                    <button onclick="changeTheme('rose')" class="w-10 h-10 rounded-full bg-rose-600 hover:scale-110 transition-transform shadow-md"></button>
                    <button onclick="changeTheme('emerald')" class="w-10 h-10 rounded-full bg-emerald-600 hover:scale-110 transition-transform shadow-md"></button>
                    <button onclick="changeTheme('amber')" class="w-10 h-10 rounded-full bg-amber-600 hover:scale-110 transition-transform shadow-md"></button>
                </div>
            </div>

            <!-- Device Storage Status -->
            <div class="bg-gray-50 rounded-2xl p-3 border border-gray-100 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-bold text-gray-500">저장 방식</span>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">💾 기기/공유 저장</span>
                </div>
                <p class="text-[11px] text-gray-500 leading-tight">로그인 없이 사용 중인 기기에 기록이 저장되며, 공유 코드로 함께할 수 있습니다.</p>
                
                <button onclick="resetAllData()" class="w-full mt-2 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 py-1.5 rounded-xl font-bold text-xs transition-all">
                    🗑️ 데이터 초기화
                </button>
            </div>

            <button onclick="closeSettingsModal()" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2.5 rounded-xl font-bold text-xs transition-all">
                닫기
            </button>
        </div>
    </div>

    <!-- Photo & Text Verification Modal -->
    <div id="photo-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold text-gray-800 mb-1 text-center">📸 오늘의 미션 인증</h3>
            <p id="modal-date-text" class="text-xs font-bold mb-3 text-center text-indigo-600"></p>
            
            <div id="camera-preview" class="w-full h-40 bg-gray-50 rounded-2xl mb-3 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center overflow-hidden relative">
                <span id="placeholder-text" class="text-gray-400 text-xs">사진을 선택하거나 촬영하세요</span>
                <img id="preview-img" class="w-full h-full object-cover hidden" alt="Preview"/>
            </div>

            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            
            <button onclick="document.getElementById('file-input').click()" class="theme-btn-light w-full py-2 rounded-xl font-bold text-xs transition-all mb-3 border">
                📷 사진 파일 선택하기
            </button>

            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">소감 또는 일기 남기기 <span class="text-rose-500">* (1줄 이상 필수)</span></label>
                <textarea id="journal-input" rows="3" placeholder="오늘 미션을 하면서 느낀 점을 1줄 이상 적어주세요!" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <p id="journal-warning" class="text-[10px] text-rose-500 mt-1 hidden">내용을 1줄 이상 작성해주세요!</p>
            </div>

            <div class="flex gap-2">
                <button onclick="closePhotoModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl font-bold text-xs transition-all">취소</button>
                <button onclick="confirmPhotoSubmission()" class="theme-btn flex-1 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow-md">완료 및 색칠하기</button>
            </div>
        </div>
    </div>

    <!-- View Entry Details Modal -->
    <div id="view-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="view-modal-title" class="text-xl font-bold text-indigo-600 mb-1 text-center">📅 인증 기록</h3>
            <p id="view-modal-date" class="text-xs text-gray-500 font-bold mb-3 text-center"></p>
            
            <div id="view-modal-entries-container" class="space-y-4">
                <!-- Dynamic entries rendered here -->
            </div>

            <button onclick="closeViewModal()" class="theme-btn w-full text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow-md mt-4">닫기</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ilil-calendar-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForSandboxEnvironment",
            authDomain: "sandbox.firebaseapp.com",
            projectId: "sandbox-project",
            storageBucket: "sandbox.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeGroup = null;

        const themes = {
            indigo: { primary: 'indigo', hex: '#4f46e5', lightBg: '#eef2ff', border: '#c7d2fe', text: '#4f46e5' },
            purple: { primary: 'purple', hex: '#9333ea', lightBg: '#f3e8ff', border: '#e9d5ff', text: '#9333ea' },
            rose: { primary: 'rose', hex: '#e11d48', lightBg: '#ffe4e6', border: '#fecdd3', text: '#e11d48' },
            emerald: { primary: 'emerald', hex: '#059669', lightBg: '#ecfdf5', border: '#a7f3d0', text: '#059669' },
            amber: { primary: 'amber', hex: '#d97706', lightBg: '#fffbeb', border: '#fde68a', text: '#d97706' }
        };

        const titles = [
            '끈기의 마스터 👑',
            '작심삼일 타파왕 🔥',
            '꾸준함의 천재 🌟',
            '작은 성취의 영웅 🦸‍♂️',
            '내일의 승리자 🎯'
        ];

        let state = {
            currentScreen: 'start',
            customReward: '내가 원하는 멋진 선물 & 자유시간 🎁',
            history: {},
            pendingDateKey: null,
            tempImage: null,
            currentYear: new Date().getFullYear(),
            currentMonth: new Date().getMonth(),
            theme: 'indigo',
            groupCode: localStorage.getItem('ilil_calendar_group_code') || null,
            myUserId: localStorage.getItem('ilil_calendar_my_id') || ('user_' + Math.random().toString(36).substr(2, 6))
        };

        localStorage.setItem('ilil_calendar_my_id', state.myUserId);

        const STORAGE_KEY_REWARD = 'ilil_calendar_reward';
        const STORAGE_KEY_HISTORY = 'ilil_calendar_history';
        const STORAGE_KEY_THEME = 'ilil_calendar_theme';

        function loadLocalData() {
            try {
                const savedReward = localStorage.getItem(STORAGE_KEY_REWARD);
                const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
                const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
                if (savedReward) state.customReward = savedReward;
                if (savedHistory) state.history = JSON.parse(savedHistory);
                if (savedTheme && themes[savedTheme]) state.theme = savedTheme;
            } catch (e) {
                console.error("Local storage load error:", e);
            }
        }

        function saveLocalData() {
            try {
                localStorage.setItem(STORAGE_KEY_REWARD, state.customReward);
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history));
                localStorage.setItem(STORAGE_KEY_THEME, state.theme);
            } catch (e) {
                console.error("Local storage save error:", e);
            }
        }

        loadLocalData();

        async function initAuthAndSync() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const { signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                    const res = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = res.user;
                } else {
                    const res = await signInAnonymously(auth);
                    currentUser = res.user;
                }
            } catch (e) {
                console.warn("Auth initialization fallback:", e);
            }

            if (state.groupCode) {
                subscribeToGroupData(state.groupCode);
            }
        }

        function subscribeToGroupData(code) {
            if (!code) return;
            if (unsubscribeGroup) unsubscribeGroup();

            const groupDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', code);

            unsubscribeGroup = onSnapshot(groupDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.history) {
                        state.history = data.history;
                        saveLocalData();
                    }
                    if (data.customReward) {
                        state.customReward = data.customReward;
                        saveLocalData();
                    }
                    render();
                    applyThemeStyles();
                } else {
                    saveCurrentStateToGroup(code);
                }
            }, (err) => {
                console.error("Group sync error:", err);
            });
        }

        async function saveCurrentStateToGroup(code = state.groupCode) {
            saveLocalData();
            if (!code || !currentUser) return;

            const groupDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'groups', code);
            try {
                await setDoc(groupDocRef, {
                    customReward: state.customReward,
                    history: state.history,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
            } catch (err) {
                console.error("Failed to save to group cloud:", err);
            }
        }

        window.applyThemeStyles = function() {
            const t = themes[state.theme];
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.style.backgroundColor = t.hex;
            });
            document.querySelectorAll('.theme-btn-light').forEach(btn => {
                btn.style.backgroundColor = t.lightBg;
                btn.style.color = t.hex;
                btn.style.borderColor = t.border;
            });
        }

        window.changeTheme = function(themeName) {
            state.theme = themeName;
            saveLocalData();
            applyThemeStyles();
            render();
        }

        window.showModal = function(title, message, icon = '🎉', callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const actionBtn = document.getElementById('modal-action-btn');
            actionBtn.onclick = function() {
                closeModal();
                if (callback) callback();
            };
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        window.closeModal = function() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        window.openSettingsModal = function() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        window.resetAllData = function() {
            if (confirm("정말로 모든 기기 데이터와 달력 기록을 삭제하시겠습니까?")) {
                localStorage.clear();
                state.history = {};
                state.groupCode = null;
                if (unsubscribeGroup) unsubscribeGroup();
                closeSettingsModal();
                showModal('초기화 완료', '모든 기록이 깨끗하게 삭제되었습니다.', '🧹', () => {
                    location.reload();
                });
            }
        }

        window.setScreen = function(screenName) {
            state.currentScreen = screenName;
            render();
            applyThemeStyles();
        }

        window.startJourney = function() {
            const today = new Date();
            if (today.getDay() === 0) {
                setScreen('result');
            } else {
                setScreen('main');
            }
        }

        window.updateReward = function(val) {
            state.customReward = val;
            if (state.groupCode) {
                saveCurrentStateToGroup();
            } else {
                saveLocalData();
            }
        }

        window.changeMonth = function(direction) {
            state.currentMonth += direction;
            if (state.currentMonth > 11) {
                state.currentMonth = 0;
                state.currentYear++;
            } else if (state.currentMonth < 0) {
                state.currentMonth = 11;
                state.currentYear--;
            }
            render();
            applyThemeStyles();
        }

        window.openGroupModal = function() {
            const displayCode = state.groupCode ? state.groupCode : '개인 달력 사용 중';
            document.getElementById('current-group-code-display').innerText = displayCode;
            document.getElementById('group-modal').classList.remove('hidden');
            document.getElementById('group-modal').classList.add('flex');
        }

        window.closeGroupModal = function() {
            document.getElementById('group-modal').classList.add('hidden');
            document.getElementById('group-modal').classList.remove('flex');
        }

        window.copyGroupCode = function() {
            if (!state.groupCode) {
                showModal('공유 코드 없음', '먼저 공유 코드를 생성하거나 연결해 주세요!', '💡');
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.value = state.groupCode;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showModal('복사 완료!', `공유 코드 (${state.groupCode})가 클립보드에 복사되었습니다. 다른 사람에게 전달하세요!`, '📋');
        }

        window.generateNewGroupCode = function() {
            const randomCode = 'TEAM-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            state.groupCode = randomCode;
            localStorage.setItem('ilil_calendar_group_code', randomCode);
            subscribeToGroupData(randomCode);
            saveCurrentStateToGroup(randomCode);
            closeGroupModal();
            showModal('새 공유 달력 생성!', `새로운 공유 코드 [ ${randomCode} ] 가 생성되었습니다. 이 코드를 다른 사람에게 전달하면 함께 달력을 색칠할 수 있습니다!`, '🎉');
            render();
        }

        window.joinGroupCode = function() {
            const input = document.getElementById('input-group-code').value.trim().toUpperCase();
            if (!input) {
                showModal('코드 입력 필요', '연결할 공유 코드를 입력해주세요.', '⚠️');
                return;
            }
            state.groupCode = input;
            localStorage.setItem('ilil_calendar_group_code', input);
            subscribeToGroupData(input);
            closeGroupModal();
            showModal('공유 달력 연결!', `[ ${input} ] 공유 달력에 성공적으로 연결되었습니다!`, '🤝');
            render();
        }

        window.switchToPersonalCalendar = function() {
            if (unsubscribeGroup) unsubscribeGroup();
            state.groupCode = null;
            localStorage.removeItem('ilil_calendar_group_code');
            closeGroupModal();
            showModal('개인 달력 전환', '나만의 개인 달력 모드로 변경되었습니다.', '🏠');
            render();
        }

        window.handleDateClick = function(year, month, day) {
            const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (state.history[dateKey]) {
                const dayEntries = state.history[dateKey];
                document.getElementById('view-modal-title').innerText = `📅 ${year}년 ${month}월 ${day}일 인증 기록`;
                document.getElementById('view-modal-date').innerText = state.groupCode ? `👥 공유 코드: ${state.groupCode}` : '🏠 개인 인증 기록';
                
                const container = document.getElementById('view-modal-entries-container');
                container.innerHTML = '';

                let entriesList = [];
                if (Array.isArray(dayEntries)) {
                    entriesList = dayEntries;
                } else if (typeof dayEntries === 'object') {
                    if (dayEntries.image || dayEntries.journal) {
                        entriesList = [dayEntries];
                    } else {
                        entriesList = Object.values(dayEntries);
                    }
                }

                entriesList.forEach((entry, idx) => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-50 border border-gray-100 rounded-2xl p-3 shadow-sm";
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-indigo-600">👤 작성자 #${idx + 1} (${entry.author || '멤버'})</span>
                            <span class="text-[10px] font-bold text-gray-400">${entry.date || ''}</span>
                        </div>
                        <div class="w-full h-40 bg-gray-100 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
                            <img src="${entry.image || 'https://placehold.co/400x300/6366f1/ffffff?text=Mission+Complete!'}" class="w-full h-full object-cover"/>
                        </div>
                        <p class="text-xs text-gray-700 whitespace-pre-line leading-relaxed bg-white p-2.5 rounded-xl border border-gray-100">${entry.journal || '남긴 소감이 없습니다.'}</p>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('view-modal').classList.remove('hidden');
                document.getElementById('view-modal').classList.add('flex');
                return;
            }

            const todayObj = new Date();
            const todayKey = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

            if (dateKey !== todayKey) {
                showModal('오늘 날짜만 선택 가능해요! ⏰', '과거 날짜나 미래 날짜는 색칠할 수 없습니다. 오늘 날짜를 클릭하여 인증해주세요!', '⚠️');
                return;
            }

            state.pendingDateKey = dateKey;
            state.tempImage = null;
            document.getElementById('preview-img').classList.add('hidden');
            document.getElementById('placeholder-text').classList.remove('hidden');
            document.getElementById('journal-input').value = '';
            document.getElementById('journal-warning').classList.add('hidden');
            document.getElementById('modal-date-text').innerText = `${year}년 ${month}월 ${day}일 (오늘)`;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-modal').classList.add('flex');
        }

        window.closePhotoModal = function() {
            document.getElementById('photo-modal').classList.add('hidden');
            document.getElementById('photo-modal').classList.remove('flex');
            state.pendingDateKey = null;
        }

        window.closeViewModal = function() {
            document.getElementById('view-modal').classList.add('hidden');
            document.getElementById('view-modal').classList.remove('flex');
        }

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.tempImage = e.target.result;
                    const preview = document.getElementById('preview-img');
                    preview.src = state.tempImage;
                    preview.classList.remove('hidden');
                    document.getElementById('placeholder-text').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        window.confirmPhotoSubmission = function() {
            const journalText = document.getElementById('journal-input').value.trim();
            
            if (journalText.length === 0) {
                document.getElementById('journal-warning').classList.remove('hidden');
                return;
            } else {
                document.getElementById('journal-warning').classList.add('hidden');
            }

            if (!state.tempImage) {
                state.tempImage = 'https://placehold.co/400x300/6366f1/ffffff?text=Today+Mission+Complete!';
            }

            if (state.pendingDateKey) {
                const newEntry = {
                    author: state.myUserId.substring(0, 5),
                    date: new Date().toLocaleDateString(),
                    image: state.tempImage,
                    journal: journalText
                };

                let currentDayEntries = state.history[state.pendingDateKey] || [];
                if (!Array.isArray(currentDayEntries)) {
                    currentDayEntries = [currentDayEntries];
                }
                currentDayEntries.push(newEntry);

                state.history[state.pendingDateKey] = currentDayEntries;

                if (state.groupCode) {
                    saveCurrentStateToGroup();
                } else {
                    saveLocalData();
                }
            }

            closePhotoModal();
            render();
            applyThemeStyles();

            const todayObj = new Date();
            if (todayObj.getDay() === 0) {
                setScreen('result');
            } else {
                showModal('색칠 완료!', '오늘 하루도 미션을 수행하고 달력을 멋지게 채웠습니다! 🎨', '✨');
            }
        }

        window.render = function() {
            const container = document.getElementById('screen-container');
            container.innerHTML = '';
            const t = themes[state.theme];

            if (state.currentScreen === 'start') {
                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center fade-in py-6">
                        <div class="w-24 h-24 rounded-3xl shadow-lg flex items-center justify-center text-5xl mb-6 transform hover:rotate-6 transition-transform" style="background: linear-gradient(135deg, ${t.hex}, #a855f7);">
                            📅
                        </div>
                        <h1 class="text-4xl font-extrabold text-gray-800 mb-2 tracking-wide">일일달력</h1>
                        <p class="text-gray-500 text-xs mb-6 px-4 leading-relaxed">
                            매일 하루 미션을 사진과 함께 색칠해보세요.<br>혼자서도, 친구들과 공유 코드로 함께도 가능해요! ✨
                        </p>

                        ${state.groupCode ? `
                            <div class="w-full bg-indigo-50 border border-indigo-200 rounded-2xl p-3 mb-4 text-center">
                                <span class="text-[11px] font-bold text-indigo-500 block">👥 참여 중인 공유 달력</span>
                                <span class="text-sm font-black text-indigo-700">${state.groupCode}</span>
                            </div>
                        ` : ''}
                        
                        <div class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-6 text-left">
                            <label class="block font-bold text-gray-800 text-xs mb-1">🎁 나만의 목표 보상 설정</label>
                            <input type="text" id="reward-input" value="${state.customReward}" oninput="updateReward(this.value)" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 font-semibold focus:outline-none focus:ring-2" placeholder="받고 싶은 보상을 적어보세요">
                        </div>

                        <button onclick="startJourney()" class="theme-btn w-full text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-98 text-lg">
                            달력 시작하기 🚀
                        </button>
                    </div>
                `;
            } else if (state.currentScreen === 'main') {
                const year = state.currentYear;
                const month = state.currentMonth;
                
                const firstDayIndex = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                
                const todayObj = new Date();
                const todayKey = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

                let completedCount = 0;
                for (let d = 1; d <= totalDays; d++) {
                    const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    if (state.history[dKey]) completedCount++;
                }

                let gridHtml = '';
                const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
                weekDays.forEach(wd => {
                    gridHtml += `<div class="text-center font-bold text-xs text-gray-400 py-1">${wd}</div>`;
                });

                for (let i = 0; i < firstDayIndex; i++) {
                    gridHtml += `<div></div>`;
                }

                for (let d = 1; d <= totalDays; d++) {
                    const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const isCompleted = state.history[dKey];
                    const isToday = (dKey === todayKey);

                    let cellStyle = 'bg-gray-50 border-gray-200 text-gray-500 hover:border-gray-400';
                    if (isCompleted) {
                        cellStyle = 'text-white shadow-md font-bold border-transparent';
                    } else if (isToday) {
                        cellStyle = 'bg-purple-50 border-purple-400 text-purple-700 font-bold ring-2 ring-purple-200';
                    }

                    let entriesCount = 0;
                    if (isCompleted) {
                        entriesCount = Array.isArray(isCompleted) ? isCompleted.length : 1;
                    }

                    gridHtml += `
                        <div onclick="handleDateClick(${year}, ${month + 1}, ${d})" class="aspect-square rounded-xl border flex flex-col items-center justify-center cursor-pointer transition-all transform hover:scale-105 relative ${cellStyle}" ${isCompleted ? `style="background-color: ${t.hex};"` : ''}>
                            <span class="text-sm">${d}</span>
                            ${isCompleted ? `<span class="text-[9px] mt-0.5">✓ ${entriesCount > 1 ? `(${entriesCount})` : ''}</span>` : isToday ? '<span class="text-[9px] text-purple-600 font-bold">오늘</span>' : ''}
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="flex-1 flex flex-col fade-in">
                        <div class="flex items-center justify-between mb-3">
                            <button onclick="setScreen('start')" class="text-gray-400 hover:text-gray-600 font-bold text-xs bg-gray-100 px-3 py-1.5 rounded-xl transition-all">← 처음으로</button>
                            <span class="text-xs font-bold px-3 py-1.5 rounded-full" style="background-color: ${t.lightBg}; color: ${t.text};">달성: ${completedCount}일</span>
                        </div>

                        <div class="flex items-center justify-between mb-4 bg-gray-50 p-3 rounded-2xl border border-gray-200">
                            <button onclick="changeMonth(-1)" class="w-8 h-8 bg-white rounded-xl shadow text-gray-600 font-bold flex items-center justify-center hover:bg-gray-100">&lt;</button>
                            <h2 class="text-lg font-extrabold text-gray-800">${year}년 ${month + 1}월</h2>
                            <button onclick="changeMonth(1)" class="w-8 h-8 bg-white rounded-xl shadow text-gray-600 font-bold flex items-center justify-center hover:bg-gray-100">&gt;</button>
                        </div>

                        <p class="text-[11px] font-bold text-center mb-2" style="color: ${t.text};">💡 오늘 날짜를 눌러 색칠하세요! 완료된 칸은 사진/일기를 확인하세요.</p>

                        <div class="grid grid-cols-7 gap-1.5 mb-4">
                            ${gridHtml}
                        </div>

                        <div class="mt-auto bg-gray-50 border border-gray-200 rounded-2xl p-4 flex items-center justify-between">
                            <div>
                                <span class="text-xs font-bold block mb-0.5" style="color: ${t.text};">나의 목표 보상</span>
                                <span class="text-xs font-bold text-gray-800 truncate max-w-[200px] block">${state.customReward}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.currentScreen === 'result') {
                const todayObj = new Date();

                let weekCompleted = true;
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(todayObj.getDate() - i);
                    const dKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    if (!state.history[dKey]) {
                        weekCompleted = false;
                        break;
                    }
                }

                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center fade-in py-6">
                        <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner animate-bounce">
                            ${weekCompleted ? '🏆' : '😢'}
                        </div>
                        <h2 class="text-3xl font-extrabold text-gray-800 mb-1">일요일 결과 발표</h2>
                        
                        ${weekCompleted ? `
                            <p class="text-gray-500 text-sm mb-6">일주일 동안 미션을 완벽히 수행했습니다!</p>
                            <div class="theme-btn rounded-2xl p-5 text-white mb-6 shadow-lg text-left" style="background-color: ${t.hex};">
                                <span class="text-xs uppercase tracking-wider opacity-80 block mb-1">획득한 칭호</span>
                                <h3 class="text-xl font-extrabold mb-3">${titles[Math.floor(Math.random() * titles.length)]}</h3>
                                <div class="border-t border-white/20 pt-3 flex justify-between items-center">
                                    <span class="text-xs opacity-80">획득한 보상</span>
                                    <span class="text-sm font-bold truncate max-w-[160px]">${state.customReward}</span>
                                </div>
                            </div>
                        ` : `
                            <p class="text-gray-500 text-sm mb-6">일주일을 다 채우지 못했어요...</p>
                            <div class="w-full bg-gradient-to-r from-gray-500 to-slate-600 rounded-2xl p-5 text-white mb-6 shadow-lg text-left">
                                <span class="text-xs uppercase tracking-wider opacity-80 block mb-1">획득한 칭호</span>
                                <h3 class="text-xl font-extrabold mb-3">다음 주 완주를 노리는 도전자 🔥</h3>
                                <div class="border-t border-white/20 pt-3 flex justify-between items-center">
                                    <span class="text-xs opacity-80">보상</span>
                                    <span class="text-sm font-bold">다음 주에 재도전해보세요!</span>
                                </div>
                            </div>
                        `}

                        <div class="flex gap-3 w-full">
                            <button onclick="setScreen('main')" class="theme-btn flex-1 text-white font-bold py-3.5 rounded-xl transition-all text-sm shadow-md" style="background-color: ${t.hex};">
                                달력으로 돌아가기
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // Window onload initialization
        window.onload = function() {
            initAuthAndSync();
            render();
            applyThemeStyles();
        }
    </script>
</body>
</html>
