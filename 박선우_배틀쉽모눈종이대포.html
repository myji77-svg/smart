<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모눈종이 해전 게임 (Battleship) - 1인용</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }

        /* 모눈종이 배경 스타일 */
        .graph-paper {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(99, 102, 241, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(99, 102, 241, 0.15) 1px, transparent 1px);
            background-color: #f8fafc;
        }

        /* 폭발 애니메이션 */
        @keyframes explosion {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-explode {
            animation: explosion 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 손글씨 폰트 적용 클래스 */
        .font-handwritten {
            font-family: 'Gaegu', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-6 text-slate-800 select-none">

    <!-- 헤더 영역 -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between bg-white p-4 rounded-2xl shadow-md border-2 border-indigo-100 mb-4 gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-3 rounded-xl shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-ship text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-indigo-900 tracking-tight">모눈종이 해전 (1인용 대결)</h1>
                <p class="text-xs text-slate-500 font-medium">나의 배를 잘 숨기고 적 함대를 대포로 침몰시키세요!</p>
            </div>
        </div>
        
        <!-- 대결 모드 및 점수판 -->
        <div class="flex items-center gap-4 bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
            <div class="text-center">
                <span class="text-xs text-slate-400 block font-bold">내 격침 수</span>
                <span id="player-score" class="text-xl font-black text-indigo-600">0 / 5</span>
            </div>
            <div class="w-px h-8 bg-slate-200"></div>
            <div class="text-center">
                <span class="text-xs text-slate-400 block font-bold">적 격침 수</span>
                <span id="enemy-score" class="text-xl font-black text-rose-500">0 / 5</span>
            </div>
        </div>
    </header>

    <!-- 현재 차례 강조 배너 -->
    <div id="turn-banner" class="w-full max-w-5xl py-2 px-4 mb-3 rounded-xl font-black text-center text-lg shadow-sm transition-all flex items-center justify-center gap-2 bg-slate-200 text-slate-700">
        <i id="turn-icon" class="fa-solid fa-flag text-slate-500"></i>
        <span id="turn-text">게임 준비 단계</span>
    </div>

    <!-- 게임 상태 안내 메시지 -->
    <div id="status-banner" class="w-full max-w-5xl bg-indigo-50 border-2 border-indigo-200 rounded-xl p-3 text-center mb-4 text-indigo-900 font-bold shadow-sm transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-info text-indigo-500"></i>
        <span id="status-text">배를 배치할 방향(가로/세로)을 선택하고 모눈종이에 배를 배치하세요!</span>
    </div>

    <!-- 빗나침/상대차례 피드백 오버레이 -->
    <div id="feedback-overlay" class="fixed inset-0 pointer-events-none z-40 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="feedback-card" class="px-8 py-6 rounded-3xl shadow-2xl border-4 text-center transform transition-transform duration-300 scale-75 bg-white">
            <div id="feedback-icon" class="text-6xl mb-2">🌊</div>
            <div id="feedback-title" class="text-3xl font-black text-slate-800">빗나갔습니다!</div>
            <div id="feedback-sub" class="text-lg font-bold text-slate-500 mt-1">상대방(컴퓨터) 차례로 넘어갑니다</div>
        </div>
    </div>

    <!-- 메인 게임 판 영역 -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-8 mb-6">
        
        <!-- 내 해군 모눈종이 -->
        <div class="bg-white p-5 rounded-2xl shadow-md border-2 border-slate-200 flex flex-col items-center">
            <div class="w-full flex items-center justify-between mb-3 px-1">
                <h2 class="font-bold text-xl text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-indigo-500"></i> 내 진지 (배 배치)
                </h2>
                <div id="placement-controls" class="flex gap-2">
                    <button id="rotate-btn" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg border border-slate-300 transition flex items-center gap-1">
                        <i class="fa-solid fa-rotate"></i> 회전 (<span id="dir-text">가로</span>)
                    </button>
                    <button id="random-btn" class="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-bold rounded-lg border border-indigo-200 transition flex items-center gap-1">
                        <i class="fa-solid fa-dice"></i> 자동 배치
                    </button>
                </div>
            </div>

            <!-- 모눈종이 보드 (크기 확대) -->
            <div class="relative graph-paper p-3 rounded-xl border-2 border-indigo-200 shadow-inner overflow-hidden w-full flex justify-center">
                <div id="player-board" class="grid grid-cols-10 gap-1.5 w-full max-w-[480px] aspect-square"></div>
            </div>

            <!-- 배치해야할 남은 배 상태 -->
            <div id="ship-list" class="w-full mt-4 flex flex-wrap justify-center gap-2"></div>
        </div>

        <!-- 상대방(컴퓨터) 모눈종이 (포격판) -->
        <div class="bg-white p-5 rounded-2xl shadow-md border-2 border-slate-200 flex flex-col items-center">
            <div class="w-full flex items-center justify-between mb-3 px-1">
                <h2 class="font-bold text-xl text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs text-rose-500"></i> 적 진지 (대포 조준)
                </h2>
                <span class="text-xs font-semibold px-2.5 py-1 bg-rose-50 text-rose-600 rounded-md border border-rose-100">
                    클릭하여 대포 발사
                </span>
            </div>

            <!-- 모눈종이 보드 (크기 확대) -->
            <div class="relative graph-paper p-3 rounded-xl border-2 border-rose-200 shadow-inner overflow-hidden w-full flex justify-center">
                <div id="enemy-board" class="grid grid-cols-10 gap-1.5 w-full max-w-[480px] aspect-square"></div>
            </div>

            <!-- 적 함대 생존 현황 -->
            <div id="enemy-ship-status" class="w-full mt-4 flex flex-wrap justify-center gap-2"></div>
        </div>
    </main>

    <!-- 하단 제어 버튼 및 로그 -->
    <footer class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl shadow-md border-2 border-slate-200">
        <div class="flex items-center gap-2 text-slate-600 text-sm w-full sm:w-auto">
            <i class="fa-solid fa-list-check text-indigo-500"></i>
            <span id="log-text" class="truncate font-medium">게임 준비 단계: 배를 모두 배치하고 '전투 시작'을 누르세요.</span>
        </div>
        <div class="flex gap-2 w-full sm:w-auto justify-end">
            <button id="start-btn" disabled class="w-full sm:w-auto px-6 py-2.5 bg-slate-300 text-white font-black rounded-xl shadow transition opacity-60 cursor-not-allowed flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 전투 시작!
            </button>
            <button id="restart-btn" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-300 transition">
                <i class="fa-solid fa-arrows-rotate"></i> 다시하기
            </button>
        </div>
    </footer>

    <!-- 게임 결과 모달 -->
    <div id="game-over-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border-4 border-indigo-100 transform transition-all">
            <div id="modal-icon" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl shadow-lg">
                🚀
            </div>
            <h2 id="modal-title" class="text-3xl font-black mb-2 text-slate-800">승리했습니다!</h2>
            <p id="modal-desc" class="text-slate-600 mb-6 font-medium">적의 모든 함대를 성공적으로 침몰시켰습니다.</p>
            <button id="modal-restart-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition transform hover:-translate-y-0.5">
                새 게임 시작하기
            </button>
        </div>
    </div>

    <script>
        // Web Audio API 효과음 생성기
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'hit') {
                    // 명중 타격음
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'miss') {
                    // 빗나침 퐁당소리
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'sunk') {
                    // 침몰음
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        const BOARD_SIZE = 10;
        
        // 함선 정보 (이름, 크기, 아이콘, 색상)
        const SHIPS_CONFIG = [
            { name: '항공모함', size: 5, icon: 'fa-ship', color: 'bg-indigo-500' },
            { name: '전함', size: 4, icon: 'fa-anchor', color: 'bg-blue-500' },
            { name: '순양함', size: 3, icon: 'fa-shield-halved', color: 'bg-teal-500' },
            { name: '잠수함', size: 3, icon: 'fa-fish', color: 'bg-emerald-500' },
            { name: '구축함', size: 2, icon: 'fa-sailboat', color: 'bg-amber-500' }
        ];

        // 게임 변수
        let gameState = 'SETUP'; // 'SETUP', 'PLAYING', 'AI_TURN', 'GAMEOVER'
        let isHorizontal = true;
        let selectedShipIndex = 0;

        let playerGrid, enemyGrid;
        let playerAttacks, enemyAttacks;
        let playerShips, enemyShips;
        let aiTargetQueue = [];

        // DOM 참조
        const playerBoardEl = document.getElementById('player-board');
        const enemyBoardEl = document.getElementById('enemy-board');
        const rotateBtn = document.getElementById('rotate-btn');
        const dirText = document.getElementById('dir-text');
        const randomBtn = document.getElementById('random-btn');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const shipListEl = document.getElementById('ship-list');
        const enemyShipStatusEl = document.getElementById('enemy-ship-status');
        const statusText = document.getElementById('status-text');
        const logText = document.getElementById('log-text');
        const playerScoreEl = document.getElementById('player-score');
        const enemyScoreEl = document.getElementById('enemy-score');
        const modal = document.getElementById('game-over-modal');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        // 차례 배너 DOM 참조
        const turnBanner = document.getElementById('turn-banner');
        const turnIcon = document.getElementById('turn-icon');
        const turnText = document.getElementById('turn-text');

        // 피드백 오버레이 DOM
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackCard = document.getElementById('feedback-card');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackSub = document.getElementById('feedback-sub');

        window.onload = () => {
            initGame();
        };

        function updateScores() {
            const playerSunk = enemyShips.filter(s => s.sunk).length;
            const enemySunk = playerShips.filter(s => s.sunk).length;
            playerScoreEl.textContent = `${playerSunk} / 5`;
            enemyScoreEl.textContent = `${enemySunk} / 5`;
        }

        // 화면 중앙에 빗나침/차례변경 대형 문구 표시
        function showFeedback(type, duration = 1200) {
            if (type === 'MISS') {
                feedbackCard.className = "px-8 py-6 rounded-3xl shadow-2xl border-4 border-blue-400 text-center transform transition-all duration-300 scale-100 bg-white/95 backdrop-blur-md";
                feedbackIcon.textContent = "🌊";
                feedbackTitle.className = "text-3xl font-black text-blue-600";
                feedbackTitle.textContent = "빗나갔습니다!";
                feedbackSub.className = "text-lg font-bold text-slate-600 mt-1";
                feedbackSub.textContent = "🤖 적(컴퓨터)의 차례로 넘어갑니다";
            } else if (type === 'ENEMY_MISS') {
                feedbackCard.className = "px-8 py-6 rounded-3xl shadow-2xl border-4 border-emerald-400 text-center transform transition-all duration-300 scale-100 bg-white/95 backdrop-blur-md";
                feedbackIcon.textContent = "🛡️";
                feedbackTitle.className = "text-3xl font-black text-emerald-600";
                feedbackTitle.textContent = "적 공격 빗나침!";
                feedbackSub.className = "text-lg font-bold text-slate-600 mt-1";
                feedbackSub.textContent = "🎯 당신의 차례입니다!";
            }

            feedbackOverlay.classList.remove('opacity-0');
            
            setTimeout(() => {
                feedbackOverlay.classList.add('opacity-0');
            }, duration);
        }

        function initGame() {
            gameState = 'SETUP';
            isHorizontal = true;
            selectedShipIndex = 0;
            
            playerGrid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            enemyGrid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            playerAttacks = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            enemyAttacks = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

            playerShips = SHIPS_CONFIG.map(s => ({ ...s, hits: 0, coords: [], sunk: false }));
            enemyShips = SHIPS_CONFIG.map(s => ({ ...s, hits: 0, coords: [], sunk: false }));

            aiTargetQueue = [];

            updateTurnBanner('SETUP');
            updateScores();
            renderBoards();
            renderShipPlacementStatus();
            renderEnemyShipStatus();

            document.getElementById('placement-controls').classList.remove('hidden');
            startBtn.classList.remove('hidden');
            startBtn.disabled = true;
            startBtn.className = "w-full sm:w-auto px-6 py-2.5 bg-slate-300 text-white font-black rounded-xl shadow transition opacity-60 cursor-not-allowed flex items-center justify-center gap-2";
            
            dirText.textContent = isHorizontal ? '가로' : '세로';
            statusText.textContent = "배를 배치할 위치에 마우스를 올리고 클릭하세요.";
            logText.textContent = "게임 준비 단계: 배를 모두 배치하세요.";

            modal.classList.add('hidden');

            // 적군(컴퓨터) 배 랜덤배치
            placeEnemyShipsRandomly();
        }

        // 플레이어 공격 처리
        function handleEnemyBoardClick(r, c) {
            if (gameState !== 'PLAYING') return;
            if (playerAttacks[r][c] !== null) {
                logText.textContent = "⚠️ 이미 포격했던 좌표입니다. 다른 위치를 선택하세요.";
                return;
            }

            initAudio();

            const target = enemyGrid[r][c];
            let isHit = false;

            if (target !== null) {
                isHit = true;
                playerAttacks[r][c] = 'HIT';
                const ship = enemyShips[target.shipId];
                ship.hits++;
                playSound('hit');

                if (ship.hits === ship.size) {
                    ship.sunk = true;
                    playSound('sunk');
                    logText.textContent = `💥 [침몰!] 적의 [${ship.name}]을(를) 완벽히 침몰시켰습니다! (한번 더 공격 가능!)`;
                } else {
                    logText.textContent = `🔥 명중! 적 함선을 맞췄습니다! (한번 더 공격 가능!)`;
                }
            } else {
                playerAttacks[r][c] = 'MISS';
                playSound('miss');
                logText.textContent = `🌊 빗나갔습니다... (${String.fromCharCode(65 + r)}-${c + 1})`;
            }

            renderBoards();
            renderEnemyShipStatus();
            updateScores();

            if (checkGameOver()) return;

            // 명중 시 한번 더 기회 부여!
            if (isHit) {
                statusText.textContent = "🔥 명중했습니다! 한번 더 공격 기회를 얻었습니다!";
            } else {
                // 빗나갔을 때 화면에 크게 빗나침 알림 표시 후 적 차례 실행
                gameState = 'AI_TURN';
                updateTurnBanner('AI_TURN');
                statusText.textContent = "⏳ 적(컴퓨터)이 대포를 조준하고 있습니다...";
                showFeedback('MISS', 1100);

                setTimeout(() => {
                    executeAiTurn();
                }, 1400);
            }
        }

        // 지능형 컴퓨터 AI 사격 로직
        function executeAiTurn() {
            if (gameState !== 'AI_TURN') return;

            let r, c;

            // AI 스마트 타겟팅
            if (aiTargetQueue.length > 0) {
                const next = aiTargetQueue.shift();
                r = next.r;
                c = next.c;
            } else {
                let valid = false;
                while (!valid) {
                    r = Math.floor(Math.random() * BOARD_SIZE);
                    c = Math.floor(Math.random() * BOARD_SIZE);
                    if (enemyAttacks[r][c] === null) valid = true;
                }
            }

            const target = playerGrid[r][c];
            let isHit = false;

            if (target !== null) {
                isHit = true;
                enemyAttacks[r][c] = 'HIT';
                const ship = playerShips[target.shipId];
                ship.hits++;
                playSound('hit');

                if (ship.hits === ship.size) {
                    ship.sunk = true;
                    playSound('sunk');
                    logText.textContent = `🚨 [침몰!] 우리의 [${ship.name}]이(가) 침몰했습니다! (적 추가 공격)`;
                } else {
                    logText.textContent = `⚠️ 적의 포격이 우리 배에 명중했습니다! (적 추가 공격)`;
                    // 주변 상하좌우 탐색 큐에 추가
                    const neighbors = [
                        { r: r - 1, c }, { r: r + 1, c },
                        { r: r, c: c - 1 }, { r: r, c: c + 1 }
                    ];

                    neighbors.forEach(n => {
                        if (n.r >= 0 && n.r < BOARD_SIZE && n.c >= 0 && n.c < BOARD_SIZE) {
                            if (enemyAttacks[n.r][n.c] === null && !aiTargetQueue.some(q => q.r === n.r && q.c === n.c)) {
                                aiTargetQueue.push(n);
                            }
                        }
                    });
                }
            } else {
                enemyAttacks[r][c] = 'MISS';
                playSound('miss');
                logText.textContent = `🛡️ 적의 대포가 빗나갔습니다. (${String.fromCharCode(65 + r)}-${c + 1})`;
            }

            renderBoards();
            updateScores();

            if (checkGameOver()) return;

            if (isHit) {
                // AI가 맞춘 경우 한번 더 공격!
                statusText.textContent = "💥 적이 대포를 맞춰 한번 더 공격합니다!";
                setTimeout(executeAiTurn, 1200);
            } else {
                // AI가 빗나간 경우 플레이어 턴으로 전환
                showFeedback('ENEMY_MISS', 1000);
                setTimeout(() => {
                    gameState = 'PLAYING';
                    updateTurnBanner('PLAYING');
                    statusText.textContent = "🎯 당신의 턴입니다! 대포를 쏠 위치를 클릭하세요.";
                }, 1000);
            }
        }

        // 보드 렌더링
        function renderBoards() {
            // 플레이어 보드
            playerBoardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `w-full h-full rounded border border-indigo-100 flex items-center justify-center transition-all duration-150 cursor-pointer relative text-xs font-bold`;

                    const shipInfo = playerGrid[r][c];
                    const attack = enemyAttacks[r][c];

                    if (shipInfo) {
                        const ship = playerShips[shipInfo.shipId];
                        if (ship.sunk) {
                            cell.classList.add('bg-slate-700', 'text-white', 'shadow-sm');
                        } else {
                            cell.classList.add(ship.color, 'text-white', 'shadow-sm');
                        }
                    } else {
                        cell.classList.add('bg-white/60', 'hover:bg-indigo-50');
                    }

                    if (attack === 'HIT') {
                        const ship = shipInfo ? playerShips[shipInfo.shipId] : null;
                        if (ship && ship.sunk) {
                            cell.innerHTML = `<i class="fa-solid fa-skull text-rose-300 text-xs"></i>`;
                        } else {
                            cell.innerHTML = `<i class="fa-solid fa-fire text-rose-500 animate-explode text-sm"></i>`;
                            cell.classList.add('bg-rose-100');
                        }
                    } else if (attack === 'MISS') {
                        cell.innerHTML = `<div class="w-2 h-2 rounded-full bg-slate-400"></div>`;
                    }

                    cell.addEventListener('mouseenter', () => handleCellHover(r, c));
                    cell.addEventListener('mouseleave', () => clearBoardHover());
                    cell.addEventListener('click', () => handleCellClick(r, c));

                    playerBoardEl.appendChild(cell);
                }
            }

            // 상대방 보드
            enemyBoardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `w-full h-full rounded border border-rose-100 flex items-center justify-center transition-all duration-150 relative text-sm font-bold`;

                    const attack = playerAttacks[r][c];
                    const shipInfo = enemyGrid[r][c];

                    if (attack === 'HIT') {
                        const ship = enemyShips[shipInfo.shipId];
                        if (ship.sunk) {
                            cell.className += ` bg-slate-800 text-rose-400 font-extrabold flex flex-col items-center justify-center leading-none`;
                            cell.innerHTML = `<i class="fa-solid fa-skull text-xs mb-0.5"></i><span class="text-[9px] font-black text-rose-300 tracking-tighter">침몰</span>`;
                        } else {
                            cell.className += ` bg-rose-500 text-white`;
                            cell.innerHTML = `<i class="fa-solid fa-fire animate-explode text-base"></i>`;
                        }
                    } else if (attack === 'MISS') {
                        cell.className += ` bg-slate-100`;
                        cell.innerHTML = `<div class="w-3 h-3 rounded-full bg-slate-300"></div>`;
                    } else {
                        cell.className += ` bg-white/60 hover:bg-rose-100 cursor-pointer`;
                    }

                    cell.addEventListener('click', () => handleEnemyBoardClick(r, c));

                    enemyBoardEl.appendChild(cell);
                }
            }
        }

        function handleCellHover(r, c) {
            if (gameState !== 'SETUP' || selectedShipIndex >= SHIPS_CONFIG.length) return;

            clearBoardHover();
            const ship = SHIPS_CONFIG[selectedShipIndex];
            const canPlace = checkCanPlace(playerGrid, r, c, ship.size, isHorizontal);

            for (let i = 0; i < ship.size; i++) {
                const nr = isHorizontal ? r : r + i;
                const nc = isHorizontal ? c + i : c;

                if (nr < BOARD_SIZE && nc < BOARD_SIZE) {
                    const cellIndex = nr * BOARD_SIZE + nc;
                    const cell = playerBoardEl.children[cellIndex];
                    if (cell) {
                        if (canPlace) {
                            cell.classList.add('bg-indigo-300', 'ring-2', 'ring-indigo-500');
                        } else {
                            cell.classList.add('bg-rose-300', 'ring-2', 'ring-rose-500');
                        }
                    }
                }
            }
        }

        function clearBoardHover() {
            Array.from(playerBoardEl.children).forEach(cell => {
                cell.classList.remove('bg-indigo-300', 'bg-rose-300', 'ring-2', 'ring-indigo-500', 'ring-rose-500');
            });
        }

        function checkCanPlace(grid, r, c, size, horizontal) {
            if (horizontal) {
                if (c + size > BOARD_SIZE) return false;
                for (let i = 0; i < size; i++) {
                    if (grid[r][c + i] !== null) return false;
                }
            } else {
                if (r + size > BOARD_SIZE) return false;
                for (let i = 0; i < size; i++) {
                    if (grid[r + i][c] !== null) return false;
                }
            }
            return true;
        }

        function handleCellClick(r, c) {
            if (gameState !== 'SETUP' || selectedShipIndex >= SHIPS_CONFIG.length) return;

            initAudio();
            const ship = SHIPS_CONFIG[selectedShipIndex];
            if (checkCanPlace(playerGrid, r, c, ship.size, isHorizontal)) {
                const coords = [];
                for (let i = 0; i < ship.size; i++) {
                    const nr = isHorizontal ? r : r + i;
                    const nc = isHorizontal ? c + i : c;
                    playerGrid[nr][nc] = { shipId: selectedShipIndex, index: i };
                    coords.push({ r: nr, c: nc });
                }
                playerShips[selectedShipIndex].coords = coords;

                selectedShipIndex++;
                renderBoards();
                renderShipPlacementStatus();

                if (selectedShipIndex >= SHIPS_CONFIG.length) {
                    statusText.textContent = "모든 배 배치가 완료되었습니다! '전투 시작' 버튼을 누르세요.";
                    startBtn.disabled = false;
                    startBtn.className = "w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-lg shadow-indigo-200 transition transform hover:-translate-y-0.5 cursor-pointer flex items-center justify-center gap-2";
                }
            } else {
                logText.textContent = "⚠️ 그곳에는 배를 배치할 수 없습니다!";
            }
        }

        randomBtn.addEventListener('click', () => {
            if (gameState !== 'SETUP') return;
            initAudio();
            playerGrid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            playerShips.forEach(s => s.coords = []);

            SHIPS_CONFIG.forEach((ship, idx) => {
                let placed = false;
                while (!placed) {
                    const horiz = Math.random() < 0.5;
                    const r = Math.floor(Math.random() * BOARD_SIZE);
                    const c = Math.floor(Math.random() * BOARD_SIZE);

                    if (checkCanPlace(playerGrid, r, c, ship.size, horiz)) {
                        const coords = [];
                        for (let i = 0; i < ship.size; i++) {
                            const nr = horiz ? r : r + i;
                            const nc = horiz ? c + i : c;
                            playerGrid[nr][nc] = { shipId: idx, index: i };
                            coords.push({ r: nr, c: nc });
                        }
                        playerShips[idx].coords = coords;
                        placed = true;
                    }
                }
            });

            selectedShipIndex = SHIPS_CONFIG.length;
            renderBoards();
            renderShipPlacementStatus();

            statusText.textContent = "모든 배 배치가 완료되었습니다! '전투 시작' 버튼을 누르세요.";
            startBtn.disabled = false;
            startBtn.className = "w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow-lg shadow-indigo-200 transition transform hover:-translate-y-0.5 cursor-pointer flex items-center justify-center gap-2";
        });

        rotateBtn.addEventListener('click', () => {
            isHorizontal = !isHorizontal;
            dirText.textContent = isHorizontal ? '가로' : '세로';
        });

        function placeEnemyShipsRandomly() {
            SHIPS_CONFIG.forEach((ship, idx) => {
                let placed = false;
                while (!placed) {
                    const horiz = Math.random() < 0.5;
                    const r = Math.floor(Math.random() * BOARD_SIZE);
                    const c = Math.floor(Math.random() * BOARD_SIZE);

                    if (checkCanPlace(enemyGrid, r, c, ship.size, horiz)) {
                        const coords = [];
                        for (let i = 0; i < ship.size; i++) {
                            const nr = horiz ? r : r + i;
                            const nc = horiz ? c + i : c;
                            enemyGrid[nr][nc] = { shipId: idx, index: i };
                            coords.push({ r: nr, c: nc });
                        }
                        enemyShips[idx].coords = coords;
                        placed = true;
                    }
                }
            });
        }

        function renderShipPlacementStatus() {
            shipListEl.innerHTML = '';
            SHIPS_CONFIG.forEach((ship, idx) => {
                const badge = document.createElement('div');
                const isPlaced = idx < selectedShipIndex;
                const isCurrent = idx === selectedShipIndex && gameState === 'SETUP';

                badge.className = `px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition-all ${
                    isPlaced 
                        ? 'bg-slate-100 border-slate-300 text-slate-400 line-through' 
                        : isCurrent 
                            ? 'bg-indigo-600 border-indigo-600 text-white shadow-md ring-2 ring-indigo-200 animate-pulse' 
                            : 'bg-white border-slate-200 text-slate-600'
                }`;

                badge.innerHTML = `<i class="fa-solid ${ship.icon}"></i> ${ship.name} (${ship.size}칸)`;
                shipListEl.appendChild(badge);
            });
        }

        function renderEnemyShipStatus() {
            enemyShipStatusEl.innerHTML = '';
            enemyShips.forEach((ship) => {
                const badge = document.createElement('div');
                badge.className = `px-3 py-1.5 rounded-xl text-xs font-bold border flex items-center gap-1.5 ${
                    ship.sunk 
                        ? 'bg-rose-900 border-rose-900 text-rose-200 line-through' 
                        : 'bg-white border-slate-200 text-slate-500'
                }`;
                badge.innerHTML = `<i class="fa-solid ${ship.icon}"></i> ${ship.name} (${ship.size}칸) ${ship.sunk ? '<b>[침몰!]</b>' : ''}`;
                enemyShipStatusEl.appendChild(badge);
            });
        }

        // 차례 배너 업데이트 함수
        function updateTurnBanner(state) {
            if (state === 'SETUP') {
                turnBanner.className = "w-full max-w-5xl py-2.5 px-4 mb-3 rounded-xl font-black text-center text-lg shadow-sm transition-all flex items-center justify-center gap-2 bg-slate-200 text-slate-700";
                turnIcon.className = "fa-solid fa-compass text-slate-600";
                turnText.textContent = "⚙️ 함대 배치 단계 (내 진지 모눈종이에 배를 숨기세요)";
            } else if (state === 'PLAYING') {
                turnBanner.className = "w-full max-w-5xl py-2.5 px-4 mb-3 rounded-xl font-black text-center text-lg shadow-sm transition-all flex items-center justify-center gap-2 bg-indigo-600 text-white animate-pulse";
                turnIcon.className = "fa-solid fa-crosshairs text-amber-300 text-xl";
                turnText.textContent = "🎯 나의 차례! (적 모눈종이를 공격하세요)";
            } else if (state === 'AI_TURN') {
                turnBanner.className = "w-full max-w-5xl py-2.5 px-4 mb-3 rounded-xl font-black text-center text-lg shadow-sm transition-all flex items-center justify-center gap-2 bg-rose-600 text-white";
                turnIcon.className = "fa-solid fa-robot text-rose-200 text-xl";
                turnText.textContent = "🤖 적(컴퓨터)의 차례입니다...";
            } else if (state === 'GAMEOVER') {
                turnBanner.className = "w-full max-w-5xl py-2.5 px-4 mb-3 rounded-xl font-black text-center text-lg shadow-sm transition-all flex items-center justify-center gap-2 bg-slate-800 text-white";
                turnIcon.className = "fa-solid fa-flag-checkered text-amber-400";
                turnText.textContent = "🏁 전투 종료";
            }
        }

        startBtn.addEventListener('click', () => {
            if (selectedShipIndex < SHIPS_CONFIG.length) return;
            initAudio();
            gameState = 'PLAYING';
            updateTurnBanner('PLAYING');
            document.getElementById('placement-controls').classList.add('hidden');
            statusText.textContent = "🎯 당신의 차례입니다! 대포를 맞추면 한번 더 쏠 수 있습니다!";
            logText.textContent = "포격을 시작합니다. 원하는 좌표를 공격하세요!";
            startBtn.classList.add('hidden');
        });

        // 승패 판정
        function checkGameOver() {
            const allEnemySunk = enemyShips.every(s => s.sunk);
            const allPlayerSunk = playerShips.every(s => s.sunk);

            if (allEnemySunk) {
                gameState = 'GAMEOVER';
                updateTurnBanner('GAMEOVER');
                showModal(true);
                return true;
            } else if (allPlayerSunk) {
                gameState = 'GAMEOVER';
                updateTurnBanner('GAMEOVER');
                showModal(false);
                return true;
            }
            return false;
        }

        // 결과 모달 창 표시
        function showModal(isPlayerWin) {
            const iconEl = document.getElementById('modal-icon');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');

            if (isPlayerWin) {
                iconEl.className = "w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl shadow-lg bg-emerald-100 text-emerald-600";
                iconEl.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                titleEl.textContent = "승리했습니다!";
                descEl.textContent = "뛰어난 대포 사격으로 적의 모든 함대를 격침시켰습니다!";
            } else {
                iconEl.className = "w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl shadow-lg bg-rose-100 text-rose-600";
                iconEl.innerHTML = `<i class="fa-solid fa-skull"></i>`;
                titleEl.textContent = "패배했습니다...";
                descEl.textContent = "아쉽게도 나의 모든 함선이 적의 포격에 침몰되었습니다.";
            }

            modal.classList.remove('hidden');
        }

        // 버튼 리스너
        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);
    </script>
</body>
</html>
