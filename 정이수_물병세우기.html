<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍾 신나는 물병 세우기 스테이지 게임!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #B5FFFC 0%, #FFDEE9 100%);
            user-select: none;
            touch-action: manipulation;
        }

        .pop-card {
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
        }

        .bounce-anim {
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Power Gauge Animation */
        .gauge-bar {
            transition: width 0.05s linear;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 md:p-6">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl p-5 md:p-8 max-w-xl w-full text-center pop-card border-4 border-cyan-300 relative overflow-hidden">
        
        <!-- 게임 상단 스테이지 / 점수 / 타이머 바 -->
        <div class="grid grid-cols-4 gap-2 mb-4 text-center">
            <div class="bg-indigo-100 border-2 border-indigo-300 rounded-2xl p-2 text-indigo-700">
                <div class="text-xs md:text-sm">🚩 레벨</div>
                <div id="level-text" class="text-xl md:text-2xl font-bold">LV.1</div>
            </div>
            <div class="bg-amber-100 border-2 border-amber-300 rounded-2xl p-2 text-amber-700">
                <div class="text-xs md:text-sm">⭐ 점수</div>
                <div id="score-text" class="text-xl md:text-2xl font-bold">0</div>
            </div>
            <div class="bg-yellow-100 border-2 border-yellow-300 rounded-2xl p-2 text-yellow-700">
                <div class="text-xs md:text-sm">🪙 코인</div>
                <div id="coin-text" class="text-xl md:text-2xl font-bold">0</div>
            </div>
            <div class="bg-rose-100 border-2 border-rose-300 rounded-2xl p-2 text-rose-700">
                <div class="text-xs md:text-sm">⏰ 시간</div>
                <div id="timer-text" class="text-xl md:text-2xl font-bold">03:00</div>
            </div>
        </div>

        <!-- 메인 게임 영역 (캔버스) -->
        <div id="game-screen" class="relative">
            <!-- 캔버스 요소 -->
            <canvas id="gameCanvas" width="500" height="350" class="w-full h-auto bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-100 rounded-2xl border-4 border-sky-300 cursor-pointer shadow-inner"></canvas>
            
            <!-- 조작 가이드 안내 -->
            <div id="instruction-overlay" class="absolute bottom-3 left-1/2 transform -translate-x-1/2 bg-white/90 px-4 py-2 rounded-full border-2 border-sky-400 text-sky-800 text-base md:text-lg font-bold pointer-events-none shadow-md">
                👇 마우스를 꾸욱 눌렀다 떼면 던져져요!
            </div>

            <!-- 파워 게이지 바 -->
            <div class="w-full bg-gray-200 h-6 rounded-full mt-3 border-2 border-gray-300 overflow-hidden relative">
                <div id="power-bar" class="gauge-bar h-full bg-gradient-to-r from-green-400 via-yellow-400 to-red-500 w-0"></div>
                <span class="absolute inset-0 flex items-center justify-center text-xs md:text-sm font-bold text-gray-700">
                    던지기 힘 (POWER)
                </span>
            </div>
        </div>

        <!-- 게임 종료 화면 -->
        <div id="result-screen" class="hidden py-6">
            <div class="bounce-anim text-7xl md:text-8xl mb-3">🍾✨</div>
            <h2 class="text-4xl md:text-5xl font-bold text-indigo-600 mb-2">게임 끝!</h2>
            <p class="text-2xl md:text-3xl text-gray-600 mb-6">멋진 물병 세우기 도전이었어요!</p>
            
            <div class="bg-amber-100 border-4 border-amber-400 rounded-3xl p-5 mb-6 shadow-md text-gray-800">
                <div class="text-2xl md:text-3xl mb-1">도달한 레벨: <span id="final-level" class="text-indigo-600 font-extrabold">LV.1</span></div>
                <div class="text-2xl md:text-3xl mb-1">최종 점수: <span id="final-score" class="text-red-500 font-extrabold">0</span>점</div>
                <div class="text-xl md:text-2xl text-yellow-700">획득한 코인: <span id="final-coins" class="font-bold">0</span>개</div>
            </div>

            <button onclick="restartGame()" class="w-full py-4 px-6 bg-emerald-400 hover:bg-emerald-500 text-white font-bold text-3xl rounded-2xl shadow-lg border-b-8 border-emerald-600 active:border-b-0 active:translate-y-2 transition-all">
                🔄 다시 하기
            </button>
        </div>

    </div>

    <script>
        // --- 게임 변수 및 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const levelText = document.getElementById('level-text');
        const scoreText = document.getElementById('score-text');
        const coinText = document.getElementById('coin-text');
        const timerText = document.getElementById('timer-text');
        const powerBar = document.getElementById('power-bar');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const instructionOverlay = document.getElementById('instruction-overlay');

        let level = 1;
        let score = 0;
        let coins = 0;
        let timeLeft = 180; // 3분 = 180초
        let timerInterval = null;
        let gameLoopReq = null;
        let isGameOver = false;

        // 마우스 파워 조작 변수
        let isCharging = false;
        let power = 0;
        let powerDirection = 1;

        // 사운드 효과 (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'flip') {
                // 던지는 효과음
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'land') {
                // 세우기 성공 소리
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            } else if (type === 'coin') {
                // 코인 획득
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                // 장애물 충돌 소리
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- 객체 정의 ---
        // 물병
        const bottle = {
            startX: 80,
            startY: 280,
            x: 80,
            y: 280,
            width: 28,
            height: 60,
            vx: 0,
            vy: 0,
            angle: 0,
            vAngle: 0,
            isFlying: false,
            reset: function() {
                this.x = this.startX;
                this.y = this.startY;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.vAngle = 0;
                this.isFlying = false;
            }
        };

        // 목표 착지 결승점 플랫폼
        let targetPlatform = {
            x: 350,
            y: 280,
            width: 100,
            height: 20
        };

        // 장애물 및 코인 배열
        let obstacles = [];
        let itemCoins = [];

        // 난이도가 상승하는 레벨별 스테이지 생성
        function generateStage() {
            levelText.textContent = `LV.${level}`;

            // 레벨이 오를수록 결승점 플랫폼 폭이 좁아짐 (최소 50px)
            const baseWidth = Math.max(100 - (level - 1) * 6, 50);
            targetPlatform.width = baseWidth;
            targetPlatform.x = 280 + Math.random() * (160 - baseWidth);

            obstacles = [];
            itemCoins = [];

            // 레벨에 따른 장애물 개수 및 속도 증가
            const obsCount = Math.min(1 + Math.floor(level / 2), 4); // 최대 4개
            const speedMultiplier = 1 + level * 0.25;

            for (let i = 0; i < obsCount; i++) {
                obstacles.push({
                    x: 170 + i * 70 + Math.random() * 20,
                    y: 90 + Math.random() * 110,
                    radius: 16 + Math.random() * 4,
                    speedY: ((Math.random() - 0.5) * 2) * speedMultiplier,
                    type: Math.random() > 0.4 ? 'bird' : 'spike'
                });
            }

            // 하늘 코인 생성 (2~4개)
            const coinCount = Math.floor(Math.random() * 3) + 2;
            for (let i = 0; i < coinCount; i++) {
                itemCoins.push({
                    x: 150 + i * 65 + Math.random() * 20,
                    y: 70 + Math.random() * 120,
                    radius: 12,
                    collected: false
                });
            }
        }

        // --- 마우스 / 터치 제어 ---
        function startCharging(e) {
            if (e.cancelable) e.preventDefault();
            if (bottle.isFlying || isGameOver) return;
            isCharging = true;
            instructionOverlay.style.display = 'none';
        }

        function stopCharging() {
            if (!isCharging || bottle.isFlying || isGameOver) return;
            isCharging = false;

            // 물병 던지기 발사
            playSound('flip');
            bottle.isFlying = true;
            bottle.vx = 3 + (power / 100) * 8.5; // X축 속도
            bottle.vy = -7 - (power / 100) * 8.5; // Y축 속도
            bottle.vAngle = 0.12 + (power / 100) * 0.12; // 회전 속도

            power = 0;
            powerBar.style.width = '0%';
        }

        canvas.addEventListener('mousedown', startCharging);
        window.addEventListener('mouseup', stopCharging);
        canvas.addEventListener('touchstart', startCharging, {passive: false});
        window.addEventListener('touchend', stopCharging);

        // --- 타이머 기능 ---
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        // --- 게임 물리 및 업데이트 ---
        function update() {
            if (isGameOver) return;

            // 파워 게이지 차오름
            if (isCharging) {
                power += (2.5 + level * 0.3) * powerDirection; // 레벨 높아지면 게이지도 빨라짐
                if (power >= 100) {
                    power = 100;
                    powerDirection = -1;
                } else if (power <= 0) {
                    power = 0;
                    powerDirection = 1;
                }
                powerBar.style.width = power + '%';
            }

            // 장애물 움직임
            obstacles.forEach(obs => {
                obs.y += obs.speedY;
                if (obs.y < 70 || obs.y > 230) obs.speedY *= -1;
            });

            // 물병 비행 물리 처리
            if (bottle.isFlying) {
                bottle.x += bottle.vx;
                bottle.y += bottle.vy;
                bottle.vy += 0.38; // 중력
                bottle.angle += bottle.vAngle; // 360도 회전

                // 코인 충돌 확인
                itemCoins.forEach(coin => {
                    if (!coin.collected) {
                        const dist = Math.hypot(bottle.x - coin.x, bottle.y - coin.y);
                        if (dist < coin.radius + 20) {
                            coin.collected = true;
                            coins++;
                            score += 50;
                            coinText.textContent = coins;
                            scoreText.textContent = score;
                            playSound('coin');
                        }
                    }
                });

                // 장애물 충돌 확인
                obstacles.forEach(obs => {
                    const dist = Math.hypot(bottle.x - obs.x, bottle.y - obs.y);
                    if (dist < obs.radius + 18) {
                        // 튕겨나감 연출
                        playSound('hit');
                        bottle.vx = -3;
                        bottle.vy = 2;
                        bottle.vAngle = -0.3;
                    }
                });

                // 결승점 플랫폼 착지 판정
                if (bottle.y >= targetPlatform.y - 30 && bottle.vy > 0) {
                    if (bottle.x >= targetPlatform.x - 8 && bottle.x <= targetPlatform.x + targetPlatform.width + 8) {
                        
                        // 회전각도 계산 (360도 한바퀴 세우기 성공 유무)
                        const normalizedAngle = Math.abs(bottle.angle % (Math.PI * 2));
                        const isUpright = normalizedAngle < 0.85 || normalizedAngle > (Math.PI * 2 - 0.85);

                        if (isUpright) {
                            // 🎉 결승점 세우기 성공! 다음 레벨로 이동!
                            playSound('land');
                            score += 100 * level;
                            scoreText.textContent = score;

                            if (typeof confetti === 'function') {
                                confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } });
                            }

                            bottle.isFlying = false;
                            setTimeout(() => {
                                level++; // 다음 레벨 난이도 상승!
                                generateStage();
                                bottle.reset();
                            }, 700);

                        } else {
                            // 넘어짐 실패
                            playSound('hit');
                            bottle.isFlying = false;
                            setTimeout(() => { bottle.reset(); }, 500);
                        }
                    }
                }

                // 화면 밖 낙하 시 실패 리셋
                if (bottle.y > 330 || bottle.x > 510 || bottle.x < -20) {
                    bottle.reset();
                }
            }
        }

        // --- 그리기 함수 ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 바닥 풀밭
            ctx.fillStyle = '#A7F3D0';
            ctx.fillRect(0, 300, canvas.width, 50);

            // 출발점
            ctx.fillStyle = '#FDE047';
            ctx.fillRect(50, 300, 60, 15);

            // 결승점 목표 받침대
            ctx.fillStyle = '#FB923C';
            ctx.beginPath();
            ctx.roundRect(targetPlatform.x, targetPlatform.y, targetPlatform.width, targetPlatform.height, 8);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#C2410C';
            ctx.stroke();

            // 결승점(FINISH) 깃발
            const flagX = targetPlatform.x + targetPlatform.width / 2;
            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.moveTo(flagX, targetPlatform.y);
            ctx.lineTo(flagX + 18, targetPlatform.y - 12);
            ctx.lineTo(flagX, targetPlatform.y - 24);
            ctx.fill();

            // 깃대
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#374151';
            ctx.beginPath();
            ctx.moveTo(flagX, targetPlatform.y);
            ctx.lineTo(flagX, targetPlatform.y - 28);
            ctx.stroke();

            // 2. 코인 그리기
            itemCoins.forEach(coin => {
                if (!coin.collected) {
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#FACC15';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#CA8A04';
                    ctx.stroke();

                    ctx.fillStyle = '#854D0E';
                    ctx.font = 'bold 12px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', coin.x, coin.y + 4);
                }
            });

            // 3. 장애물 그리기
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                if (obs.type === 'bird') {
                    ctx.fillStyle = '#F43F5E';
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '14px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText('🐦', obs.x, obs.y + 5);
                } else {
                    ctx.fillStyle = '#4B5563';
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '14px Jua';
                    ctx.textAlign = 'center';
                    ctx.fillText('💣', obs.x, obs.y + 5);
                }
            });

            // 4. 물병 그리기
            ctx.save();
            ctx.translate(bottle.x, bottle.y);
            ctx.rotate(bottle.angle);

            ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
            ctx.beginPath();
            ctx.roundRect(-bottle.width / 2, -bottle.height / 2, bottle.width, bottle.height, 6);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#0284C7';
            ctx.stroke();

            // 물 효과
            ctx.fillStyle = 'rgba(14, 165, 233, 0.9)';
            ctx.fillRect(-bottle.width / 2 + 2, 0, bottle.width - 4, bottle.height / 2 - 2);

            // 뚜껑
            ctx.fillStyle = '#EF4444';
            ctx.fillRect(-6, -bottle.height / 2 - 8, 12, 8);

            ctx.restore();
        }

        // --- 메인 게임 루프 ---
        function loop() {
            update();
            draw();
            if (!isGameOver) {
                gameLoopReq = requestAnimationFrame(loop);
            }
        }

        // --- 게임 시작 및 재시작 ---
        function initGame() {
            level = 1;
            score = 0;
            coins = 0;
            timeLeft = 180;
            isGameOver = false;

            scoreText.textContent = score;
            coinText.textContent = coins;
            updateTimerDisplay();

            bottle.reset();
            generateStage();

            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            instructionOverlay.style.display = 'block';

            clearInterval(timerInterval);
            startTimer();

            cancelAnimationFrame(gameLoopReq);
            loop();
        }

        // --- 게임 종료 ---
        function endGame() {
            isGameOver = true;
            clearInterval(timerInterval);
            cancelAnimationFrame(gameLoopReq);

            document.getElementById('final-level').textContent = `LV.${level}`;
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-coins').textContent = coins;

            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
        }

        function restartGame() {
            initGame();
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
