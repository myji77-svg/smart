<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="geocoding-endpoint" content="https://nominatim.openstreetmap.org/reverse">
    <title>반반마켓 - 함께 사고 같이 가는 동네 생활</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        /* Hide scrollbar for category list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-orange-500/20">
                    <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-900">반반마켓</h1>
                    <button onclick="getCurrentLocation()" class="text-xs text-orange-600 font-medium hover:underline flex items-center gap-1 mt-0.5" id="locationBtn">
                        <i class="fa-solid fa-location-crosshairs text-[11px]"></i> <span id="userLocationText">내 동네 찾기 (GPS)</span>
                    </button>
                </div>
            </div>
            <button onclick="openWriteModal()" class="bg-orange-500 hover:bg-orange-600 active:scale-95 transition-all text-white px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 shadow-md shadow-orange-500/20">
                <i class="fa-solid fa-pen-to-square"></i> 글쓰기
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full flex-1 pb-20">
        <!-- Search Bar -->
        <div class="p-4 bg-white border-b border-slate-100">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderPosts()" placeholder="제목, 장소, 품목 검색..." class="w-full bg-slate-100 pl-10 pr-4 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all">
            </div>
        </div>

        <!-- Category Horizontal Scroll -->
        <div class="bg-white border-b border-slate-200 py-3 px-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar" id="categoryContainer">
                <!-- Categories rendered dynamically via JS -->
            </div>
        </div>

        <!-- Post List Container -->
        <div id="postList" class="p-4 space-y-4">
            <!-- Posts rendered dynamically -->
        </div>
        <div class="px-4 text-[10px] text-slate-500 space-y-1">
            <p>주소 데이터: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" class="underline">OpenStreetMap contributors</a> · <a href="https://operations.osmfoundation.org/policies/nominatim/" target="_blank" rel="noopener noreferrer" class="underline">Nominatim 이용 정책</a></p>
            <p>GPS 실행 시 좌표를 주소 조회 서비스에 전송합니다. 실제 동네와 다르면 직접 입력해주세요.</p>
            <button type="button" onclick="openManualLocation('동네 이름을 입력해주세요.')" class="text-orange-600 underline">동네 직접 입력</button>
        </div>
    </main>

    <!-- GPS 오류 시 수동 동네 입력 -->
    <div id="manualLocationPanel" class="hidden fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="manualLocationTitle">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 id="manualLocationTitle" class="font-bold text-slate-800">동네 직접 입력</h3>
                <button type="button" onclick="closeManualLocation()" class="text-slate-500 p-2" aria-label="닫기">✕</button>
            </div>
            <p id="locationError" role="status" class="text-xs text-slate-600 mb-3"></p>
            <form onsubmit="event.preventDefault(); saveManualLocation()" class="flex gap-2">
                <input id="manualLocationInput" aria-label="동네 이름" maxlength="80" required placeholder="예: 부천시 원미구 중동" class="min-w-0 flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50">
                <button class="bg-orange-500 text-white rounded-xl px-4 py-2 text-xs font-semibold">선택</button>
            </form>
            <p class="text-[10px] text-slate-400 mt-2">입력한 동네 이름을 그대로 사용합니다.</p>
        </div>
    </div>
    <!-- Write Modal -->
    <div id="writeModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transform transition-transform duration-200 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-lg">새 글 작성하기</h3>
                <button onclick="closeWriteModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="postForm" onsubmit="handleFormSubmit(event)" class="mt-4 space-y-4">
                <!-- Category Select -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">모임/구매 목적 <span class="text-red-500">*</span></label>
                    <select id="postCategory" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                        <option value="마트 같이갈사람">🛒 마트 같이 갈 사람</option>
                        <option value="반반 살 사람">⚖️ 생필품/식재료 반반 살 사람</option>
                        <option value="배송비 나누기">📦 온라인/택배 배송비 나누기</option>
                        <option value="중고나눔/교환">🎁 중고 나눔 및 물물교환</option>
                        <option value="동네 꿀팁">💡 장보기 꿀팁 & 세일 정보</option>
                        <option value="기타 모임">💬 기타 동네 모임</option>
                    </select>
                </div>

                <!-- Title -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="postTitle" required placeholder="예: 코스트코 계란/고기 같이 나눠서 사실 분!" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                </div>

                <!-- Location & Time Row -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">만날 장소 / 마트명</label>
                            <button type="button" onclick="fillGpsToLocation()" class="text-[10px] text-orange-600 hover:underline font-semibold flex items-center gap-0.5">
                                <i class="fa-solid fa-crosshairs"></i> GPS 입력
                            </button>
                        </div>
                        <input type="text" id="postLocation" placeholder="예: 이마트 역삼점" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예정 시간</label>
                        <input type="text" id="postTime" placeholder="예: 오늘 저녁 7시" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                    </div>
                </div>

                <!-- Price / Target People -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예상 금액/나눌 금액</label>
                        <input type="text" id="postPrice" placeholder="예: 약 15,000원" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">모집 인원</label>
                        <select id="postPeople" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none">
                            <option value="2명">2명 (1:1)</option>
                            <option value="3명">3명</option>
                            <option value="4명 이상">4명 이상</option>
                            <option value="제한 없음">제한 없음</option>
                        </select>
                    </div>
                </div>

                <!-- Content -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상세 내용 <span class="text-red-500">*</span></label>
                    <textarea id="postContent" required rows="3" placeholder="자세한 인원 모으기 사유나 나눌 물품의 상세 정보를 적어주세요." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-orange-500/50 focus:outline-none resize-none"></textarea>
                </div>

                <!-- Action Button -->
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 active:scale-98 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md shadow-orange-500/20">
                    게시글 등록하기
                </button>
            </form>
        </div>
    </div>

    <!-- Post Detail / Comments Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transform transition-transform duration-200 max-h-[90vh] flex flex-col">
            <div id="detailContent" class="overflow-y-auto flex-1">
                <!-- Dynamically filled -->
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">메시지 내용</span>
    </div>

    <script>
        // Category Configuration
        const CATEGORIES = [
            { id: '전체', label: '전체 보기', icon: 'fa-border-all' },
            { id: '마트 같이갈사람', label: '🛒 마트 같이갈사람', icon: 'fa-cart-shopping' },
            { id: '반반 살 사람', label: '⚖️ 반반 살 사람', icon: 'fa-scale-balanced' },
            { id: '배송비 나누기', label: '📦 배송비 나누기', icon: 'fa-box' },
            { id: '중고나눔/교환', label: '🎁 나눔/물물교환', icon: 'fa-hand-holding-heart' },
            { id: '동네 꿀팁', label: '💡 동네 꿀팁', icon: 'fa-lightbulb' },
            { id: '기타 모임', label: '💬 기타 모임', icon: 'fa-comments' }
        ];

        // Default Initial Demo Data
        const DEFAULT_POSTS = [
            {
                id: 1700000001,
                category: '마트 같이갈사람',
                title: '오늘 저녁 트레이더스 같이 차 타고 가실 분! (차량 제공)',
                location: '이마트 트레이더스 서면점',
                time: '오늘 저녁 7시 30분',
                price: '무료 (기름값 안받음)',
                people: '2명',
                content: '혼자 가기 심심하고 짐도 많아서 차 타고 같이 장보러 가실 분 구합니다! 올 때 집 부근까지 태워다 드릴 수 있어요.',
                likes: 5,
                comments: [
                    { id: 1, writer: '동네주민A', text: '혹시 돌아오는 길에 대연동 쪽 지나가시나요?', time: '10분 전' }
                ],
                createdAt: new Date(Date.now() - 3600000).toISOString()
            },
            {
                id: 1700000002,
                category: '반반 살 사람',
                title: '코스트코 베이글 1+1 묶음 절반 나누실 분 계신가요?',
                location: '수영구 수영역 3번 출구',
                time: '내일 오후 2시',
                price: '약 3,500원',
                people: '2명',
                content: '어니언 베이글 1팩, 블루베리 베이글 1팩 해서 총 2팩인데 혼자 먹기엔 많네요! 한 팩씩 나눠서 교환해요.',
                likes: 8,
                comments: [],
                createdAt: new Date(Date.now() - 7200000).toISOString()
            }
        ];

        // Application State
        let currentCategory = '전체';
        let posts = [];
        let activePostId = null;
        let userCurrentAddress = '우리동네 (GPS 미인증)';

        // Initialize App
        window.onload = function() {
            loadPostsFromStorage();
            renderCategories();
            renderPosts();
            document.getElementById('userLocationText').innerText = '내 동네 찾기 (GPS)';
        };

        // 버튼을 눌렀을 때만 주소를 조회하며 동일 좌표는 캐시합니다.
        let locationPending = false;
        let locationSelected = false;
        let lastAddressRequest = 0;
        const addressCache = new Map();
        let fillLocationAfterLookup = false;

        function formatNeighborhood(address) {
            const district = address.borough || address.city_district || address.county;
            const neighborhood = address.quarter || address.neighbourhood || address.suburb || address.village || address.town;
            const parts = [address.city || address.municipality || address.state, district, neighborhood];
            return [...new Set(parts.filter(Boolean))].join(' ');
        }

        async function reverseGeocode(lat, lon) {
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('좌표가 올바르지 않습니다.');
            const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
            if (addressCache.has(key)) return addressCache.get(key);
            const delay = Math.max(0, 1100 - (Date.now() - lastAddressRequest));
            if (delay) await new Promise(resolve => setTimeout(resolve, delay));
            lastAddressRequest = Date.now();
            const url = new URL(document.querySelector('meta[name="geocoding-endpoint"]').content);
            url.search = new URLSearchParams({format: 'jsonv2', lat: String(lat), lon: String(lon), addressdetails: '1', zoom: '18', 'accept-language': 'ko'}).toString();
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch(url, {signal: controller.signal, referrerPolicy: 'strict-origin-when-cross-origin'});
                if (!response.ok) throw new Error('주소 조회 서비스를 사용할 수 없습니다.');
                const data = await response.json();
                const name = formatNeighborhood(data.address || {});
                if (data.error || !name) throw new Error('이 좌표의 동네 이름을 찾지 못했습니다.');
                addressCache.set(key, name);
                return name;
            } finally {
                clearTimeout(timer);
            }
        }

        function openManualLocation(message) {
            document.getElementById('locationError').innerText = message;
            document.getElementById('manualLocationPanel').classList.remove('hidden');
            document.getElementById('manualLocationInput').focus();
        }

        function closeManualLocation() {
            document.getElementById('manualLocationPanel').classList.add('hidden');
            fillLocationAfterLookup = false;
        }

        function applyLocation(name) {
            userCurrentAddress = name;
            locationSelected = true;
            document.getElementById('userLocationText').innerText = name;
            if (fillLocationAfterLookup) document.getElementById('postLocation').value = name;
            fillLocationAfterLookup = false;
        }

        function saveManualLocation() {
            const name = document.getElementById('manualLocationInput').value.trim();
            if (!name) return showToast('동네 이름을 입력해주세요.');
            applyLocation(name);
            closeManualLocation();
            showToast('동네를 설정했습니다.');
        }

        async function getCurrentLocation() {
            if (locationPending) return;
            const locText = document.getElementById('userLocationText');
            const button = document.getElementById('locationBtn');
            locationPending = true;
            button.disabled = true;
            locText.innerText = 'GPS 위치 파악 중...';
            try {
                if (!window.isSecureContext || location.protocol === 'file:') throw new Error('GPS는 GitHub Pages 등 HTTPS 주소에서 이용해주세요.');
                if (!navigator.geolocation) throw new Error('이 브라우저는 GPS를 지원하지 않습니다.');
                const position = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(
                    resolve, reject, {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000}
                ));
                locText.innerText = '동네 이름 확인 중...';
                const name = await reverseGeocode(position.coords.latitude, position.coords.longitude);
                applyLocation(name);
                showToast('현재 동네를 설정했습니다.');
            } catch (error) {
                const messages = {1: '위치 접근 권한이 거부되었습니다.', 2: '현재 위치를 찾을 수 없습니다.', 3: 'GPS 조회 시간이 초과되었습니다.'};
                const message = messages[error.code] || (error.name === 'AbortError' ? '주소 조회 시간이 초과되었습니다.' : error.message || '주소 조회에 실패했습니다.');
                locText.innerText = locationSelected ? userCurrentAddress : '동네를 직접 입력해주세요';
                openManualLocation(message + ' 동네 이름을 직접 입력해주세요.');
                showToast('동네 직접 입력으로 전환했습니다.');
            } finally {
                locationPending = false;
                button.disabled = false;
            }
        }

        function fillGpsToLocation() {
            if (locationSelected && !locationPending) {
                document.getElementById('postLocation').value = userCurrentAddress;
                showToast('선택된 동네가 입력되었습니다.');
            } else {
                fillLocationAfterLookup = true;
                if (!locationPending) getCurrentLocation();
            }
        }

        // LocalStorage Data Management
        function loadPostsFromStorage() {
            try {
                const stored = localStorage.getItem('banban_market_posts');
                if (stored) {
                    posts = JSON.parse(stored);
                } else {
                    posts = DEFAULT_POSTS;
                    savePostsToStorage();
                }
            } catch (e) {
                console.error('Failed to load from LocalStorage', e);
                posts = DEFAULT_POSTS;
            }
        }

        function savePostsToStorage() {
            try {
                localStorage.setItem('banban_market_posts', JSON.stringify(posts));
            } catch (e) {
                console.error('Failed to save to LocalStorage', e);
                showToast('데이터 저장 중 오류가 발생했습니다.');
            }
        }

        // Render Category Filter Buttons
        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = CATEGORIES.map(cat => {
                const isActive = currentCategory === cat.id;
                const activeClasses = isActive 
                    ? 'bg-orange-500 text-white shadow-sm' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200';
                return `
                    <button onclick="setCategory('${cat.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${activeClasses}">
                        ${cat.label}
                    </button>
                `;
            }).join('');
        }

        function setCategory(catId) {
            currentCategory = catId;
            renderCategories();
            renderPosts();
        }

        // Render Posts List
        function renderPosts() {
            const listEl = document.getElementById('postList');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            let filtered = posts.filter(post => {
                const matchCategory = (currentCategory === '전체') || (post.category === currentCategory);
                const matchSearch = !searchVal || 
                    post.title.toLowerCase().includes(searchVal) || 
                    post.content.toLowerCase().includes(searchVal) ||
                    (post.location && post.location.toLowerCase().includes(searchVal));
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 p-6">
                        <div class="w-16 h-16 bg-orange-50 text-orange-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                            <i class="fa-solid fa-basket-shopping"></i>
                        </div>
                        <p class="text-slate-600 font-semibold text-sm">등록된 게시글이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">첫 번째 모임이나 나눔 글을 직접 작성해보세요!</p>
                        <button onclick="openWriteModal()" class="mt-4 px-4 py-2 bg-orange-500 text-white rounded-full text-xs font-semibold">
                            글쓰기
                        </button>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(post => {
                const timeAgo = formatTimeAgo(post.createdAt);
                const categoryBadgeColor = getCategoryColor(post.category);

                return `
                    <div onclick="openDetailModal(${post.id})" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-all cursor-pointer">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${categoryBadgeColor}">
                                ${post.category}
                            </span>
                            <span class="text-[11px] text-slate-400">${timeAgo}</span>
                        </div>

                        <h3 class="font-bold text-slate-800 text-base mb-1 line-clamp-1">${escapeHtml(post.title)}</h3>
                        <p class="text-slate-600 text-xs line-clamp-2 mb-3 leading-relaxed">${escapeHtml(post.content)}</p>

                        <div class="bg-slate-50 p-2.5 rounded-xl text-xs space-y-1 text-slate-600 mb-3 border border-slate-100">
                            ${post.location ? `<div class="flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-orange-500 w-3 text-center"></i> <span><b>장소:</b> ${escapeHtml(post.location)}</span></div>` : ''}
                            ${post.time ? `<div class="flex items-center gap-1.5"><i class="fa-regular fa-clock text-blue-500 w-3 text-center"></i> <span><b>시간:</b> ${escapeHtml(post.time)}</span></div>` : ''}
                            ${post.price ? `<div class="flex items-center gap-1.5"><i class="fa-solid fa-won-sign text-emerald-500 w-3 text-center"></i> <span><b>금액:</b> ${escapeHtml(post.price)}</span></div>` : ''}
                        </div>

                        <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-100">
                            <div class="flex items-center gap-1">
                                <i class="fa-solid fa-users text-slate-400"></i> 모집인원: <span class="font-semibold text-slate-700">${post.people || '미정'}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="event.stopPropagation(); toggleLike(${post.id})" class="flex items-center gap-1 hover:text-red-500 transition-colors">
                                    <i class="fa-solid fa-heart text-red-500"></i>
                                    <span>${post.likes || 0}</span>
                                </button>
                                <span class="flex items-center gap-1">
                                    <i class="fa-regular fa-comment"></i>
                                    <span>${post.comments ? post.comments.length : 0}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Post Detail Modal
        function openDetailModal(postId) {
            activePostId = postId;
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const modal = document.getElementById('detailModal');
            const detailContent = document.getElementById('detailContent');
            const timeAgo = formatTimeAgo(post.createdAt);

            detailContent.innerHTML = `
                <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${getCategoryColor(post.category)}">
                        ${post.category}
                    </span>
                    <div class="flex items-center gap-2">
                        <button onclick="deletePost(${post.id})" class="text-xs text-red-500 hover:underline px-2 py-1">삭제</button>
                        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="py-4">
                    <h2 class="text-lg font-bold text-slate-900 mb-1">${escapeHtml(post.title)}</h2>
                    <span class="text-xs text-slate-400 block mb-4">${timeAgo} 작성</span>

                    <div class="bg-orange-50/50 rounded-xl p-3 text-xs space-y-1.5 border border-orange-100 text-slate-700 mb-4">
                        ${post.location ? `<div><i class="fa-solid fa-location-dot text-orange-500 mr-1.5"></i><b>장소:</b> ${escapeHtml(post.location)}</div>` : ''}
                        ${post.time ? `<div><i class="fa-regular fa-clock text-blue-500 mr-1.5"></i><b>예정 시간:</b> ${escapeHtml(post.time)}</div>` : ''}
                        ${post.price ? `<div><i class="fa-solid fa-won-sign text-emerald-500 mr-1.5"></i><b>예상 금액:</b> ${escapeHtml(post.price)}</div>` : ''}
                        <div><i class="fa-solid fa-users text-indigo-500 mr-1.5"></i><b>모집 정원:</b> ${escapeHtml(post.people || '미정')}</div>
                    </div>

                    <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-line mb-6">${escapeHtml(post.content)}</p>

                    <!-- Like Button -->
                    <div class="flex items-center justify-between py-3 border-t border-b border-slate-100 mb-4">
                        <button onclick="toggleLike(${post.id})" class="flex items-center gap-2 text-sm font-semibold text-slate-700 hover:text-red-500 transition-colors">
                            <i class="fa-solid fa-heart text-red-500"></i> 좋아요 <span class="bg-slate-100 px-2 py-0.5 rounded-full text-xs">${post.likes}</span>
                        </button>
                        <span class="text-xs text-slate-400">댓글 ${post.comments ? post.comments.length : 0}개</span>
                    </div>

                    <!-- Comments Section -->
                    <div class="space-y-3">
                        <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider">댓글 목록</h4>
                        
                        <div class="space-y-2" id="commentsList">
                            ${(post.comments && post.comments.length > 0) ? post.comments.map(c => `
                                <div class="bg-slate-50 p-3 rounded-xl text-xs">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="font-bold text-slate-800">${escapeHtml(c.writer)}</span>
                                        <span class="text-[10px] text-slate-400">${c.time}</span>
                                    </div>
                                    <p class="text-slate-600">${escapeHtml(c.text)}</p>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 py-2">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>'}
                        </div>

                        <!-- Comment Input -->
                        <div class="flex gap-2 pt-2">
                            <input type="text" id="commentInput" placeholder="댓글을 입력하세요..." class="flex-1 bg-slate-100 text-xs px-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/50">
                            <button onclick="addComment(${post.id})" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all">
                                작성
                            </button>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                activePostId = null;
            }, 200);
        }

        // New Post Actions
        function openWriteModal() {
            const modal = document.getElementById('writeModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeWriteModal() {
            const modal = document.getElementById('writeModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('postForm').reset();
            }, 200);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value.trim();
            const location = document.getElementById('postLocation').value.trim();
            const time = document.getElementById('postTime').value.trim();
            const price = document.getElementById('postPrice').value.trim();
            const people = document.getElementById('postPeople').value;
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                showToast('필수 정보를 입력해주세요.');
                return;
            }

            const newPost = {
                id: Date.now(),
                category,
                title,
                location: location || '장소 협의',
                time: time || '시간 협의',
                price: price || '가격 협의',
                people,
                content,
                likes: 0,
                comments: [],
                createdAt: new Date().toISOString()
            };

            posts.unshift(newPost);
            savePostsToStorage();
            renderPosts();
            closeWriteModal();
            showToast('게시글이 성공적으로 등록되었습니다!');
        }

        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.likes += 1;
                savePostsToStorage();
                renderPosts();
                if (activePostId === postId) {
                    openDetailModal(postId);
                }
                showToast('좋아요를 눌렀습니다!');
            }
        }

        function addComment(postId) {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const post = posts.find(p => p.id === postId);
            if (post) {
                if (!post.comments) post.comments = [];
                post.comments.push({
                    id: Date.now(),
                    writer: '익명 주민',
                    text: text,
                    time: '방금 전'
                });
                savePostsToStorage();
                renderPosts();
                openDetailModal(postId);
                showToast('댓글이 작성되었습니다.');
            }
        }

        function deletePost(postId) {
            posts = posts.filter(p => p.id !== postId);
            savePostsToStorage();
            renderPosts();
            closeDetailModal();
            showToast('게시글이 삭제되었습니다.');
        }

        // Utility Helpers
        function getCategoryColor(category) {
            switch(category) {
                case '마트 같이갈사람': return 'bg-emerald-100 text-emerald-700';
                case '반반 살 사람': return 'bg-orange-100 text-orange-700';
                case '배송비 나누기': return 'bg-blue-100 text-blue-700';
                case '중고나눔/교환': return 'bg-pink-100 text-pink-700';
                case '동네 꿀팁': return 'bg-amber-100 text-amber-700';
                default: return 'bg-indigo-100 text-indigo-700';
            }
        }

        function formatTimeAgo(isoString) {
            if (!isoString) return '방금 전';
            const date = new Date(isoString);
            const now = new Date();
            const diffMin = Math.floor((now - date) / (1000 * 60));

            if (diffMin < 1) return '방금 전';
            if (diffMin < 60) return `${diffMin}분 전`;
            const diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return `${diffHour}시간 전`;
            const diffDay = Math.floor(diffHour / 24);
            return `${diffDay}일 전`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
